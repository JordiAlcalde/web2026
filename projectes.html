<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projecte - Mínim Món</title>
  
  <!-- Font Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #24153F;
      --bg-card: #301269;
      --primary: #340094;
      --accent: #AC80FF;
      --soft-lilac: #C8AAFF;
      --text-light: #E3D4FF;
      --text-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      line-height: 1.6;
    }

    /* Contenidor Principal */
    #project-container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    /* 1. Component Hero (Capçalera compacta) */
    .component-hero {
      position: relative;
      background-color: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 40px;
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(200, 170, 255, 0.2);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(36,21,63,0.4) 0%, rgba(36,21,63,0.85) 100%);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      padding: 30px;
    }

    .hero-content h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-white);
      margin-bottom: 10px;
    }

    .hero-content p {
      font-size: 1.1rem;
      color: var(--soft-lilac);
      font-weight: 400;
    }

    /* 2. Component Video + Text */
    .component-video-text {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: center;
      background: var(--bg-card);
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 40px;
    }

    .video-wrapper video, .video-wrapper iframe {
      width: 100%;
      border-radius: 8px;
      aspect-ratio: 16/9;
      border: none;
    }

    .video-text h3 {
      font-size: 1.4rem;
      color: var(--accent);
      margin-bottom: 12px;
    }

    /* 3. Component Imatge + Text */
    .component-imatge-text {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: center;
      padding: 30px;
      margin-bottom: 40px;
    }

    .component-imatge-text.reverse {
      direction: rtl;
    }
    
    .component-imatge-text.reverse .text-content {
      direction: ltr;
    }

    .image-wrapper img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .text-content h3 {
      font-size: 1.4rem;
      color: var(--soft-lilac);
      margin-bottom: 12px;
    }

    /* 4. Component Bloc de Text Pur */
    .component-bloc-text {
      background: rgba(48, 18, 105, 0.4);
      border-left: 4px solid var(--accent);
      padding: 25px 30px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 40px;
    }

    .component-bloc-text h3 {
      font-size: 1.3rem;
      color: var(--text-white);
      margin-bottom: 10px;
    }

    /* 5. Peu de Pàgina Estàndard */
    footer {
      text-align: center;
      padding: 40px 20px 20px;
      border-top: 1px solid rgba(200, 170, 255, 0.1);
      margin-top: 60px;
    }

    footer p {
      font-size: 0.9rem;
      color: var(--soft-lilac);
    }

    /* Responsive per a mòbils */
    @media (max-width: 768px) {
      .component-video-text, .component-imatge-text {
        grid-template-columns: 1fr;
      }
      .component-imatge-text.reverse {
        direction: ltr;
      }
      .hero-content h1 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>

  <div id="project-container">
    <!-- Els components es carregaran dinàmicament aquí segons el camp 'Ordre' -->
  </div>

  <footer>
    <p>© Mínim Món - Recreacions simbòliques i peces úniques en fusta</p>
  </footer>

  <script>
    // URL de l'API / Web App d'Apps Script que retorna el JSON del full 'Projectes'
    const APPS_SCRIPT_URL = 'ESCRIU_AQUI_LA_TEVA_URL_DE_APPS_SCRIPT';
    
    // Obtenir l'ID del projecte de la URL (per defecte pr_0001 si no n'hi ha cap)
    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get('id') || 'pr_0001';

    async function carregarProjecte() {
      try {
        // En una implementació real es fa el fetch a Apps Script:
        // const response = await fetch(`${APPS_SCRIPT_URL}?id=${projectId}`);
        // const data = await response.json();
        
        // Simulació amb les dades que estàs omplint per al testeig de pr_0001:
        const data = {
          ID_Projecte: "pr_0001",
          Nom_Projecte: "La casa del poble",
          Estat: "Actiu",
          Ordre: "Hero;Video_1;ImatgeText_1;BlocText_1;ImatgeText_2;Video_2;BlocText_2",
          Hero_Titol: "Un record d'infantesa immortalitzat en fusta",
          Hero_Imatge_Link: "https://via.placeholder.com/1200x400/301269/E3D4FF?text=M%C3%ADnim+M%C3%B3n+Hero",
          Video_1_Titol: "Procés de gravat i tall",
          Video_1_Link: "",
          Video_1_Text: "Cada teula i cada finestra està dissenyada per capturar l'essència exacta de la façana original.",
          Video_2_Titol: "",
          Video_2_Link: "",
          Video_2_Text: "",
          ImatgeText_1_Titol: "Detalls que parlen",
          ImatgeText1_Link: "https://via.placeholder.com/600x400/24153F/AC80FF?text=Detall+Fusta",
          ImatgeText_1_Text: "La fusta de vern aporta una textura càlida i suau que ressalta els volums físics de la peça.",
          ImatgeText_2_Titol: "",
          ImatgeText_2_Link: "",
          ImatgeText_2_Text: "",
          BlocText_1_Titol: "El concepte darrere la peça",
          BlocText_1_Text: "Aquest projecte neix de la voluntat de condensar en pocs centímetres els valors i la memòria d'una llar familiar.",
          BlocText_2_Titol: "",
          BlocText_2_Text: ""
        };

        renderitzarProjecte(data);
      } catch (error) {
        console.error("Error carregant el projecte:", error);
      }
    }

    function renderitzarProjecte(p) {
      const container = document.getElementById('project-container');
      container.innerHTML = '';

      // Convertim el text del camp 'Ordre' en una llista
      const ordreComponents = p.Ordre.split(';').map(c => c.trim());

      ordreComponents.forEach(comp => {
        switch (comp) {
          case 'Hero':
            if (p.Nom_Projecte) {
              container.innerHTML += `
                <section class="component-hero" style="background-image: url('${p.Hero_Imatge_Link}');">
                  <div class="hero-overlay"></div>
                  <div class="hero-content">
                    <h1>${p.Nom_Projecte}</h1>
                    ${p.Hero_Titol ? `<p>${p.Hero_Titol}</p>` : ''}
                  </div>
                </section>
              `;
            }
            break;

          case 'Video_1':
            if (p.Video_1_Link || p.Video_1_Text) {
              container.innerHTML += `
                <section class="component-video-text">
                  <div class="video-wrapper">
                    ${p.Video_1_Link ? `<iframe src="${p.Video_1_Link}" allowfullscreen></iframe>` : '<div style="background:#110826;height:200px;display:flex;align-items:center;justify-content:center;border-radius:8px;">[Vídeo de mostra]</div>'}
                  </div>
                  <div class="video-text">
                    ${p.Video_1_Titol ? `<h3>${p.Video_1_Titol}</h3>` : ''}
                    <p>${p.Video_1_Text}</p>
                  </div>
                </section>
              `;
            }
            break;

          case 'ImatgeText_1':
            if (p.ImatgeText1_Link || p.ImatgeText_1_Text) {
              container.innerHTML += `
                <section class="component-imatge-text">
                  <div class="image-wrapper">
                    <img src="${p.ImatgeText1_Link}" alt="${p.ImatgeText_1_Titol || 'Imatge projecte'}">
                  </div>
                  <div class="text-content">
                    ${p.ImatgeText_1_Titol ? `<h3>${p.ImatgeText_1_Titol}</h3>` : ''}
                    <p>${p.ImatgeText_1_Text}</p>
                  </div>
                </section>
              `;
            }
            break;

          case 'ImatgeText_2':
            if (p.ImatgeText_2_Link || p.ImatgeText_2_Text) {
              container.innerHTML += `
                <section class="component-imatge-text reverse">
                  <div class="image-wrapper">
                    <img src="${p.ImatgeText_2_Link}" alt="${p.ImatgeText_2_Titol || 'Imatge projecte'}">
                  </div>
                  <div class="text-content">
                    ${p.ImatgeText_2_Titol ? `<h3>${p.ImatgeText_2_Titol}</h3>` : ''}
                    <p>${p.ImatgeText_2_Text}</p>
                  </div>
                </section>
              `;
            }
            break;

          case 'BlocText_1':
            if (p.BlocText_1_Text) {
              container.innerHTML += `
                <section class="component-bloc-text">
                  ${p.BlocText_1_Titol ? `<h3>${p.BlocText_1_Titol}</h3>` : ''}
                  <p>${p.BlocText_1_Text}</p>
                </section>
              `;
            }
            break;

          case 'BlocText_2':
            if (p.BlocText_2_Text) {
              container.innerHTML += `
                <section class="component-bloc-text">
                  ${p.BlocText_2_Titol ? `<h3>${p.BlocText_2_Titol}</h3>` : ''}
                  <p>${p.BlocText_2_Text}</p>
                </section>
              `;
            }
            break;
        }
      });
    }

    // Inicialitzar la càrrega
    carregarProjecte();
  </script>
</body>
</html>
