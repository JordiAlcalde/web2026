<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projecte - Mínim Món</title>
  
  <!-- Font Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #24153F;
      --bg-card: #301269;
      --primary: #340094;
      --accent: #AC80FF;
      --soft-lilac: #C8AAFF;
      --text-light: #E3D4FF;
      --text-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      line-height: 1.6;
    }

    /* Contenidor Principal */
    #project-container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    /* Component 1: Hero (Capçalera del projecte) */
    .component-hero {
      position: relative;
      background-color: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 40px;
      min-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(200, 170, 255, 0.2);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(36,21,63,0.5) 0%, rgba(36,21,63,0.9) 100%);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      padding: 40px 20px;
    }

    .hero-content h1 {
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--text-white);
      margin-bottom: 12px;
    }

    .hero-content p {
      font-size: 1.2rem;
      color: var(--soft-lilac);
      font-weight: 400;
    }

    /* Component 2 & 5: Video + Text */
    .component-video-text {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: center;
      background: var(--bg-card);
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 40px;
      border: 1px solid rgba(172, 128, 255, 0.15);
    }

    .video-wrapper iframe, .video-wrapper video {
      width: 100%;
      border-radius: 8px;
      aspect-ratio: 16/9;
      border: none;
    }

    .video-text h3 {
      font-size: 1.4rem;
      color: var(--accent);
      margin-bottom: 12px;
    }

    /* Component 3 & 4: Imatge + Text */
    .component-imatge-text {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: center;
      padding: 20px 0;
      margin-bottom: 40px;
    }

    .component-imatge-text.reverse {
      direction: rtl;
    }
    
    .component-imatge-text.reverse .text-content {
      direction: ltr;
    }

    .image-wrapper img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .text-content h3 {
      font-size: 1.4rem;
      color: var(--soft-lilac);
      margin-bottom: 12px;
    }

    /* Component 6 & 7: Bloc de Text Pur */
    .component-bloc-text {
      background: rgba(48, 18, 105, 0.5);
      border-left: 4px solid var(--accent);
      padding: 25px 30px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 40px;
    }

    .component-bloc-text h3 {
      font-size: 1.3rem;
      color: var(--text-white);
      margin-bottom: 10px;
    }

    /* Peu de pàgina estàndard */
    footer {
      text-align: center;
      padding: 40px 20px 30px;
      border-top: 1px solid rgba(200, 170, 255, 0.15);
      margin-top: 60px;
      background-color: #1a0e30;
    }

    footer p {
      font-size: 0.9rem;
      color: var(--soft-lilac);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .component-video-text, .component-imatge-text {
        grid-template-columns: 1fr;
      }
      .component-imatge-text.reverse {
        direction: ltr;
      }
      .hero-content h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <div id="project-container">
    <p style="text-align: center; padding: 50px; color: var(--soft-lilac);">Carregant projecte Mínim Món...</p>
  </div>

  <footer>
    <p>© Mínim Món - Recreacions simbòliques i peces úniques en fusta</p>
  </footer>

  <script>
    // Ruta del fitxer CSV exportat dins del repositori de GitHub
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vScSqZ3Oknz4LVr8OiATGxLZUTXc6EqkCRGIg1G2mxYemMvn8Bttn9w5eyV9sDVd5w4mI7kJtR7LjFt/pub?gid=405305768&single=true&output=csv'; 

    // Llegim l'ID de la URL (per defecte pr_0001)
    const urlParams = new URLSearchParams(window.location.search);
    const idParam = urlParams.get('id') || 'pr_0001';
    
    // Normalitzem l'ID per coincidir amb el full (pr-0001 -> pr_0001)
    const targetId = idParam.replace('-', '_');

    async function carregarProjecte() {
      try {
        const response = await fetch(CSV_URL);
        const csvText = await response.text();
        const projecte = parseCSV(csvText, targetId);

        if (projecte) {
          renderitzarProjecte(projecte);
        } else {
          document.getElementById('project-container').innerHTML = 
            `<p style="text-align:center; padding: 50px; color: var(--accent);">No s'ha trobat cap projecte amb l'ID: ${targetId}</p>`;
        }
      } catch (error) {
        console.error("Error en carregar el CSV:", error);
      }
    }

    // Parser manual de CSV per gestionar cometes i salts de línia
    function parseCSV(text, searchId) {
      const lines = text.split(/\r?\n/);
      if (lines.length < 2) return null;

      const headers = parseCSVLine(lines[0]);

      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const row = parseCSVLine(lines[i]);
        
        if (row[0] === searchId) {
          const obj = {};
          headers.forEach((header, index) => {
            obj[header.trim()] = row[index] ? row[index].trim() : '';
          });
          return obj;
        }
      }
      return null;
    }

    function parseCSVLine(text) {
      const result = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
          inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          result.push(cur);
          cur = '';
        } else {
          cur += c;
        }
      }
      result.push(cur);
      return result;
    }

    function renderitzarProjecte(p) {
      const container = document.getElementById('project-container');
      container.innerHTML = '';

      if (!p.Ordre) return;

      const ordre = p.Ordre.split(';').map(c => c.trim());

      ordre.forEach(comp => {
        switch (comp) {
          case 'Hero':
            if (p.Nom_Projecte) {
              container.innerHTML += `
                <section class="component-hero" style="${p.Hero_Imatge_Link ? `background-image: url('${p.Hero_Imatge_Link}')` : ''}">
                  <div class="hero-overlay"></div>
                  <div class="hero-content">
                    <h1>${p.Nom_Projecte}</h1>
                    ${p.Hero_Titol ? `<p>${p.Hero_Titol}</p>` : ''}
                  </div>
                </section>
              `;
            }
            break;

          case 'Video_1':
            if (p.Video_1_Link || p.Video_1_Text) {
              container.innerHTML += `
                <section class="component-video-text">
                  <div class="video-wrapper">
                    ${p.Video_1_Link ? `<iframe src="${p.Video_1_Link}" allowfullscreen></iframe>` : '<div style="background:#110826;height:200px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--accent);">[Vídeo 1]</div>'}
                  </div>
                  <div class="video-text">
                    ${p.Video_1_Titol ? `<h3>${p.Video_1_Titol}</h3>` : ''}
                    <p>${p.Video_1_Text}</p>
                  </div>
                </section>
              `;
            }
            break;

          case 'Video_2':
            if (p.Video_2_Link || p.Video_2_Text) {
              container.innerHTML += `
                <section class="component-video-text">
                  <div class="video-wrapper">
                    ${p.Video_2_Link ? `<iframe src="${p.Video_2_Link}" allowfullscreen></iframe>` : '<div style="background:#110826;height:200px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--accent);">[Vídeo 2]</div>'}
                  </div>
                  <div class="video-text">
                    ${p.Video_2_Titol ? `<h3>${p.Video_2_Titol}</h3>` : ''}
                    <p>${p.Video_2_Text}</p>
                  </div>
                </section>
              `;
            }
            break;

          case 'ImatgeText_1':
            if (p.ImatgeText1_Link || p.ImatgeText_1_Text) {
              container.innerHTML += `
                <section class="component-imatge-text">
                  <div class="image-wrapper">
                    ${p.ImatgeText1_Link ? `<img src="${p.ImatgeText1_Link}" alt="${p.ImatgeText_1_Titol}">` : ''}
                  </div>
                  <div class="text-content">
                    ${p.ImatgeText_1_Titol ? `<h3>${p.ImatgeText_1_Titol}</h3>` : ''}
                    <p>${p.ImatgeText_1_Text}</p>
                  </div>
                </section>
              `;
            }
            break;

          case 'ImatgeText_2':
            if (p.ImatgeText_2_Link || p.ImatgeText_2_Text) {
              container.innerHTML += `
                <section class="component-imatge-text reverse">
                  <div class="image-wrapper">
                    ${p.ImatgeText_2_Link ? `<img src="${p.ImatgeText_2_Link}" alt="${p.ImatgeText_2_Titol}">` : ''}
                  </div>
                  <div class="text-content">
                    ${p.ImatgeText_2_Titol ? `<h3>${p.ImatgeText_2_Titol}</h3>` : ''}
                    <p>${p.ImatgeText_2_Text}</p>
                  </div>
                </section>
              `;
            }
            break;

          case 'BlocText_1':
            if (p.BlocText_1_Text || p.BlocText_1_Titol) {
              container.innerHTML += `
                <section class="component-bloc-text">
                  ${p.BlocText_1_Titol ? `<h3>${p.BlocText_1_Titol}</h3>` : ''}
                  <p>${p.BlocText_1_Text}</p>
                </section>
              `;
            }
            break;

          case 'BlocText_2':
            if (p.BlocText_2_Text || p.BlocText_2_Titol) {
              container.innerHTML += `
                <section class="component-bloc-text">
                  ${p.BlocText_2_Titol ? `<h3>${p.BlocText_2_Titol}</h3>` : ''}
                  <p>${p.BlocText_2_Text}</p>
                </section>
              `;
            }
            break;
        }
      });
    }

    carregarProjecte();
  </script>
</body>
</html>
