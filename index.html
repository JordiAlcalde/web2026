<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mínim Món | Recreacions Simbòliques</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="components.css">
    <!-- Font Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpg" href="logo_mm_300.jpg">
</head>
<body>

    <!-- BARRA DE NAVEGACIÓ SUPERIOR -->
    <header class="nav-principal">
        <div class="nav-contenidor">
            <!-- Botó Hamburguesa (Mòbil) -->
            <button class="btn-hamburguesa" id="btn-hamburguesa" aria-label="Obrir menú" onclick="toggleMenuMobil()">
                <span></span>
                <span></span>
                <span></span>
            </button>
    
            <a href="#" class="logo-link" onclick="activarSeccioInicial(); return false;">
                <img id="logo-img" src="logo_mm_300.jpg" alt="Logo Mínim Món" class="logo-imatge">
                <span class="nom-marca">Mínim Món</span>
            </a>
    
            <ul id="menu-navegacio" class="menu-links">
                <!-- Es construeix des de Google Sheets -->
            </ul>
        </div>
    </header>

    <main id="seccions-contenidor">
        <!-- Contingut dinàmic -->
    </main>

    <script>
        const URL_CSV_CONFIG      = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScSqZ3Oknz4LVr8OiATGxLZUTXc6EqkCRGIg1G2mxYemMvn8Bttn9w5eyV9sDVd5w4mI7kJtR7LjFt/pub?gid=0&single=true&output=csv";
        const URL_CSV_ESTRUCTURA  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScSqZ3Oknz4LVr8OiATGxLZUTXc6EqkCRGIg1G2mxYemMvn8Bttn9w5eyV9sDVd5w4mI7kJtR7LjFt/pub?gid=888628017&single=true&output=csv";
        const URL_CSV_COMPONENTS  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScSqZ3Oknz4LVr8OiATGxLZUTXc6EqkCRGIg1G2mxYemMvn8Bttn9w5eyV9sDVd5w4mI7kJtR7LjFt/pub?gid=606337148&single=true&output=csv";
        const URL_CSV_CONTINGUTS  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScSqZ3Oknz4LVr8OiATGxLZUTXc6EqkCRGIg1G2mxYemMvn8Bttn9w5eyV9sDVd5w4mI7kJtR7LjFt/pub?gid=819396845&single=true&output=csv";

        let dadesWeb = { config: {}, estructura: [], components: {}, continguts: [] };

        document.addEventListener('DOMContentLoaded', () => {
            carregarDadesPàgina();
        });

        // Diccionari que mapeja els noms de la validació de Sheets amb el seu valor HEX
        const MAPA_COLORS = {
            'Primari': '#301269',
            'Vivid': '#340094',
            'Accent': '#AC80FF',
            'Suau': '#C8AAFF',
            'Clar': '#E3D4FF',
            'Fons fosc': '#24153F',
            'Blanc': '#FFFFFF',
            'Negre': '#000000'
        };
        
        function obtenirColorHex(nomColor, valorPerDefecte = '#24153F') {
            if (!nomColor || nomColor.trim() === '' || nomColor.trim() === '#N/A') {
                return valorPerDefecte;
            }
        
            const net = nomColor.trim();
        
            if (MAPA_COLORS[net]) {
                return MAPA_COLORS[net];
            }
        
            if (net.startsWith('#')) {
                return net;
            }
            if (/^[0-9A-F]{6}$/i.test(net)) {
                return `#${net}`;
            }
        
            return valorPerDefecte;
        }
                
        function carregarDadesPàgina() {
            const t = Date.now();
            Promise.all([
                fetch(`${URL_CSV_CONFIG}&_t=${t}`).then(r => r.text()),
                fetch(`${URL_CSV_ESTRUCTURA}&_t=${t}`).then(r => r.text()),
                fetch(`${URL_CSV_COMPONENTS}&_t=${t}`).then(r => r.text()),
                fetch(`${URL_CSV_CONTINGUTS}&_t=${t}`).then(r => r.text())
            ])
            .then(([csvConfig, csvEstructura, csvComponents, csvContinguts]) => {
                dadesWeb.config = parsejarCSVConfig(csvConfig);
                dadesWeb.estructura = parsejarCSVEstructura(csvEstructura);
                dadesWeb.components = parsejarCSVComponents(csvComponents);
                dadesWeb.continguts = parsejarCSVContinguts(csvContinguts);
        
                actualitzarLogo();
                construirMenuNavegacio();
                construirPantallesWeb();
                activarSeccioInicial();
            })
            .catch(error => console.error("Error carregant les dades CSV:", error));
        }

        function actualitzarLogo() {
            const logoId = dadesWeb.config['logo'] || dadesWeb.config['logo_id'];
            const imgElement = document.getElementById('logo-img');
            
            if (logoId && imgElement) {
                imgElement.src = `https://drive.google.com/thumbnail?sz=w600&id=${logoId.trim()}`;
            } else if (imgElement) {
                imgElement.src = 'logo_mm_600.jpg';
            }
        }

        function parseCSV(text) {
            let p = '', c = '', r = [];
            let q = false;
            let row = [''];
            for (let i = 0; i < text.length; i++) {
                c = text[i];
                p = text[i - 1];
                if (c === '"') {
                    if (q && text[i + 1] === '"') { row[row.length - 1] += '"'; i++; }
                    else { q = !q; }
                } else if (c === ',' && !q) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !q) {
                    if (c === '\r' && text[i + 1] === '\n') { i++; }
                    r.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') { r.push(row); }
            return r;
        }

        function parsejarCSVConfig(csvText) {
            const files = parseCSV(csvText);
            const config = {};
            files.slice(1).forEach(fila => {
                if (fila[0] && fila[1]) config[fila[0].trim()] = fila[1].trim();
            });
            return config;
        }

        function parsejarCSVComponents(csvText) {
            const files = parseCSV(csvText);
            const components = {};
            files.slice(1).forEach(fila => {
                const nomComponent = (fila[0] || '').trim().toLowerCase();
                if (nomComponent) {
                    components[nomComponent] = {
                        layoutDefecte: (fila[1] || '').trim(),
                        colorFonsDefecte: (fila[2] || '#FFFFFF').trim(),
                        colorTextDefecte: (fila[3] || '#24153F').trim()
                    };
                }
            });
            return components;
        }        

        function parsejarCSVEstructura(csvText) {
            const files = parseCSV(csvText);
            return files.slice(1)
                .filter(fila => fila[0] && fila[0].trim() !== '')
                .map(fila => {
                    const titolPagina = (fila[1] || '').trim();
                    const rawHeroTitol = (fila[5] || '').trim();
                    const rawHeroText = (fila[6] || '').trim();
                    const rawHeroDestacat = (fila[7] || '').trim();

                    let valSpan = (fila[13] || '').trim();
                    let leftSpanCss = '0px';
                    if (valSpan !== '') {
                        let numSpan = parseInt(valSpan);
                        if (!isNaN(numSpan)) {
                            leftSpanCss = `${numSpan}px`;
                        }
                    }

                    return {
                        id: (fila[0] || '').trim(),
                        titol: titolPagina,
                        ordre: parseInt(fila[2]) || 99,
                        visible: fila[3] ? fila[3].toUpperCase().trim() === 'TRUE' : true,
                        tipus: (fila[4] || 'galeria_filtrada').trim(),
                        heroTitol: rawHeroTitol !== '' ? rawHeroTitol.replace(/\n/g, '<br>') : titolPagina,
                        heroText: rawHeroText ? rawHeroText.replace(/\n/g, '<br>') : '',
                        heroDestacat: rawHeroDestacat ? rawHeroDestacat.replace(/\n/g, '<br>') : '',
                        heroImatge: (fila[8] || '').trim(), 
                        heroAmple: fila[10] && fila[10].trim() !== '' ? `${parseInt(fila[10])}px` : '550px',
                        heroAlign: fila[11] ? fila[11].toLowerCase().trim() : 'left',
                        heroFontColor: (fila[12] && fila[12].trim() !== '') ? fila[12].trim() : '#E3D4FF',
                        heroLeftSpan: leftSpanCss
                    };
                }).sort((a, b) => a.ordre - b.ordre);
        }

        function parsejarCSVContinguts(csvText) {
            const files = parseCSV(csvText);
            return files.slice(1).map(fila => ({
                id: (fila[0] || '').trim(),
                seccio: (fila[1] || '').trim(),
                titol: (fila[2] || '').trim(),
                descripcio: (fila[3] || '').trim(),
                imatgeId: (fila[4] || '').trim(),
                link: (fila[5] || '').trim(), // S'utilitza tambe per a URL general i per al vídeo de Drive
                destacat: fila[6] ? fila[6].toUpperCase().trim() === 'TRUE' : false,
                tipusComponent: (fila[7] || '').trim(),
                situacioImatge: (fila[8] || 'Esquerra').trim(),
                midaImatge: (fila[9] || '').trim(),
                textBoto: (fila[10] || '').trim(),
                linkBoto: (fila[11] || '').trim(),
                alineacioBoto: (fila[12] || 'Centre').trim(),
                novaFila: fila[13] ? (fila[13].toUpperCase().trim() === 'TRUE' || fila[13].toUpperCase().trim() === 'SI') : false,
                colorFons: (fila[14] || '').trim(),
                colorText: (fila[15] || '').trim(),
                ample: (fila[16] || '').trim(),
                altImatge: (fila[17] || '').trim(),
                velocitat: (fila[18] || '').trim(),
                bucle: (fila[19] || '').trim(),
                videoAutoStart: fila[20] ? (fila[20].toUpperCase().trim() === 'TRUE' || fila[20].toUpperCase().trim() === 'SI') : false,
                videoControls: fila[21] ? (fila[21].toUpperCase().trim() !== 'NO' && fila[21].toUpperCase().trim() !== 'FALSE') : true
            })).filter(item => item.id !== '');
        }

        function construirMenuNavegacio() {
            const menuUL = document.getElementById('menu-navegacio');
            menuUL.innerHTML = '';
            
            dadesWeb.estructura.forEach(pagina => {
                if (!pagina.visible) return;
                const li = document.createElement('li');
                li.innerHTML = `<a href="#${pagina.id}" onclick="navegarA('${pagina.id}', event); return false;">${pagina.titol}</a>`;
                menuUL.appendChild(li);
            });
        }

        
        function construirPantallesWeb() {
            const contenidorPrincipal = document.getElementById('seccions-contenidor');
            contenidorPrincipal.innerHTML = '';
            
            dadesWeb.estructura.forEach(pagina => {
                if (!pagina.visible) return;
        
                const seccioHTML = document.createElement('section');
                seccioHTML.id = `pantalla-${pagina.id}`;
                seccioHTML.className = 'seccio-web';
                
                const teImatge = pagina.heroImatge && pagina.heroImatge.trim() !== '' && pagina.heroImatge.trim() !== '#N/A';
                const urlHeroImatge = teImatge ? `https://drive.google.com/thumbnail?sz=w1600&id=${pagina.heroImatge.trim()}` : '';
        
                const estilFons = teImatge 
                    ? `background-image: linear-gradient(to right, rgba(36, 21, 63, 0.75) 0%, rgba(36, 21, 63, 0.25) 60%, rgba(36, 21, 63, 0) 100%), url('${urlHeroImatge}');` 
                    : `background-color: var(--color-fons-fosc, #24153F);`;
        
                const htmlHero = `
                    <div class="hero-pagina" style="${estilFons}">
                        <div class="hero-contenedor-flex">
                            <div class="hero-caixa-contingut" style="
                                max-width: ${pagina.heroAmple}; 
                                transform: translateX(${pagina.heroLeftSpan}); 
                                text-align: ${pagina.heroAlign};
                                color: ${pagina.heroFontColor};">
                                
                                <h1 style="font-size: 2.2rem; font-weight: 700; color: ${pagina.heroFontColor}; line-height: 1.25; margin-bottom: 0.8rem;">
                                    ${pagina.heroTitol}
                                </h1>
                                
                                ${pagina.heroText ? `
                                    <div class="hero-cos-text" style="font-size: 1.1rem; font-weight: 400; color: ${pagina.heroFontColor}; margin-top: 0.8rem;">
                                        ${pagina.heroText}
                                    </div>` : ''}
                                
                                ${pagina.heroDestacat ? `
                                    <div class="destacat-hero" style="font-size: 1.2rem; font-weight: 600; color: ${pagina.heroFontColor}; margin-top: 1rem;">
                                        ${pagina.heroDestacat}
                                    </div>` : ''}
                            </div>
                        </div>
                    </div>
                `;
        
                seccioHTML.innerHTML = htmlHero;
        
                const elementsSeccio = dadesWeb.continguts.filter(item => item.seccio === pagina.id);
                
                if (elementsSeccio.length > 0) {
                    const contenidorContinguts = document.createElement('div');
                    contenidorContinguts.className = 'contenidor-continguts-seccio';
        
                    let contenidorFilaFlex = null;
                    let grupGaleria = [];
                    let grupCarrusel = [];
        
                    const processarGaleriaPendent = () => {
                        if (grupGaleria.length > 0) {
                            contenidorContinguts.appendChild(crearGaleriaActiva(grupGaleria));
                            grupGaleria = [];
                        }
                    };
        
                    const processarCarruselPendent = () => {
                        if (grupCarrusel.length > 0 && contenidorFilaFlex) {
                            contenidorFilaFlex.appendChild(crearCarruselImatges(grupCarrusel));
                            grupCarrusel = [];
                        }
                    };
                    
                    elementsSeccio.forEach(item => {
                        
                        const tipus = item.tipusComponent ? item.tipusComponent.toLowerCase().trim() : '';

                        // LOG DE CONTROL: Veure quin component s'està avaluant
                        if (tipus === 'peu_de_pagina') {
                            console.log("Detectat peu_de_pagina a les dades:", item);
                        }else{
                            console.log("Component: ", item);
                        }
                    
                        if (tipus !== 'galeria_activa') processarGaleriaPendent();
                        if (tipus !== 'carrusel_imatges') processarCarruselPendent();
                    
                        if (tipus === 'galeria_activa') {
                            contenidorFilaFlex = null;
                            grupGaleria.push(item);
                    
                        } else if (tipus === 'espaiador') {
                            // L'espaiador tanca la fila flex activa i s'insereix al 100% d'ample
                            contenidorFilaFlex = null;
                            const tempDiv = document.createElement('div');
                            tempDiv.style.width = '100%';
                            tempDiv.innerHTML = crearEspaiador(item);
                            contenidorContinguts.appendChild(tempDiv.firstElementChild);
                    
                        } else if (tipus === 'separador') {
                            // El separador tanca la fila flex activa i s'insereix al 100% d'ample
                            contenidorFilaFlex = null;
                            const tempDiv = document.createElement('div');
                            tempDiv.style.width = '100%';
                            tempDiv.innerHTML = crearSeparador(item);
                            contenidorContinguts.appendChild(tempDiv.firstElementChild);
                    
                        } else if (tipus === 'peu_de_pagina') {
                            // El peu de pàgina tanca qualsevol fila i s'insereix directament al contenidor de secció
                            contenidorFilaFlex = null;
                            const tempDiv = document.createElement('div');
                            tempDiv.style.width = '100%';
                            tempDiv.innerHTML = crearPeuPagina(item);
                            contenidorContinguts.appendChild(tempDiv.firstElementChild);
                    
                        } else {
                            // Només crea una nova fila flex si és un component de contingut estàndard (targetes, text, CTA, vídeo, etc.)
                            if (item.novaFila || !contenidorFilaFlex) {
                                processarCarruselPendent();
                                
                                contenidorFilaFlex = document.createElement('div');
                                contenidorFilaFlex.className = 'contenidor-fila-flex';
                                
                                // Posicionament dinàmic segons SituacióImatge
                                const pos = (item.situacioImatge || '').toLowerCase().trim();
                                if (pos === 'centre' || pos === 'center') {
                                    contenidorFilaFlex.classList.add('posicio-centre');
                                } else if (pos === 'dreta' || pos === 'right') {
                                    contenidorFilaFlex.classList.add('posicio-dreta');
                                } else {
                                    contenidorFilaFlex.classList.add('posicio-esquerra');
                                }
                    
                                contenidorContinguts.appendChild(contenidorFilaFlex);
                            }
                    
                            // Avaluació i creació dels components estàndard
                            if (tipus === 'carrusel_imatges') {
                                grupCarrusel.push(item);
                            } else if (tipus === 'bloc_text') {
                                contenidorFilaFlex.appendChild(crearBlocText(item));
                            } else if (tipus === 'targeta_imatge_text') {
                                contenidorFilaFlex.appendChild(crearTargetaImatgeText(item));
                            } else if (tipus === 'bloc_imatge_text') {
                                contenidorFilaFlex.appendChild(crearBlocImatgeText(item));
                            } else if (tipus === 'boto_cta') {
                                contenidorFilaFlex.appendChild(crearBotoCTA(item));
                            } else if (tipus === 'video' || tipus === 'video_1:1' || tipus === 'video_16:9' || tipus === 'video_9:16') {
                                const tempDiv = document.createElement('div');
                                tempDiv.innerHTML = crearComponentVideo(item);
                                contenidorFilaFlex.appendChild(tempDiv.firstElementChild);
                            } else {
                                contenidorFilaFlex.appendChild(crearTargetaElement(item));
                            }                    
                        }
                        
                    });
        
                    processarGaleriaPendent();
                    processarCarruselPendent();
        
                    seccioHTML.appendChild(contenidorContinguts);
                }
        
                contenidorPrincipal.appendChild(seccioHTML);
            });
        }
        
        function crearTargetaElement(item) {
            const card = document.createElement('div');
            card.className = 'targeta-element';
            
            const urlImatge = item.imatgeId ? `https://drive.google.com/thumbnail?sz=w800&id=${item.imatgeId}` : 'logo_mm_600.jpg';

            card.innerHTML = `
                <img src="${urlImatge}" alt="${item.titol}">
                <h3 style="color: var(--color-clar, #E3D4FF); font-size: 1.1rem; margin-bottom: 0.5rem;">${item.titol}</h3>
                <p style="color: var(--color-suau, #C8AAFF); font-size: 0.85rem;">${item.descripcio || ''}</p>
            `;
            return card;
        }

        function canviarSeccio(idSeccio) {
            const menu = document.getElementById('menu-navegacio');
            if (menu) menu.classList.remove('obert');
        
            const idNetejat = idSeccio.replace('#', '').replace('pantalla-', '').trim();
            const seccions = document.querySelectorAll('.seccio-web');
            
            seccions.forEach(s => s.classList.remove('activa'));
            
            const seccioDesti = document.getElementById(`pantalla-${idNetejat}`) || document.getElementById(idNetejat);
            if (seccioDesti) {
                seccioDesti.classList.add('activa');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        
            const linksMenu = document.querySelectorAll('#menu-navegacio a');
            linksMenu.forEach(a => {
                const href = a.getAttribute('href') || '';
                if (href.replace('#', '') === idNetejat) {
                    a.classList.add('actiu');
                } else {
                    a.classList.remove('actiu');
                }
            });
        }

        function activarSeccioInicial() {
            if (dadesWeb.estructura && dadesWeb.estructura.length > 0) {
                canviarSeccio(dadesWeb.estructura[0].id);
            }
        }

        function toggleMenuMobil() {
            const menu = document.getElementById('menu-navegacio');
            if (menu) menu.classList.toggle('obert');
        }   

        function navegarA(desti, event) {
            if (event) event.preventDefault();
            
            const menu = document.getElementById('menu-navegacio');
            if (menu) menu.classList.remove('obert');
        
            if (!desti || desti === '#') return;
        
            if (desti.startsWith('#') || !desti.includes('://')) {
                canviarSeccio(desti);
            } else {
                window.open(desti, '_blank');
            }
        }

        /* *************************************************************
        /* C O M P O N E N T S 
        /* ********************************************************** */

        /* *************************************************************
        /* bloc_imatge_text
        /* ********************************************************** */        
        function crearBlocImatgeText(item) {
            const bloc = document.createElement('div');
            bloc.className = 'bloc-imatge-text';
            
            if (item.situacioImatge && item.situacioImatge.toLowerCase().trim() === 'dreta') {
                bloc.classList.add('orientacio-dreta');
            }
        
            let amplaImatge = '50%';
            if (item.midaImatge && item.midaImatge.trim() !== '' && item.midaImatge.trim() !== '#N/A') {
                const valor = item.midaImatge.trim().toLowerCase();
                if (valor === 'petita') amplaImatge = '25%';
                else if (valor === 'mitjana') amplaImatge = '40%';
                else if (valor === 'gran') amplaImatge = '55%';
                else amplaImatge = !isNaN(valor) ? `${valor}%` : valor;
            }
            
            const configDefecte = dadesWeb.components['bloc_imatge_text'] || {
                colorFonsDefecte: '#24153F',
                colorTextDefecte: '#E3D4FF'
            };
            const fons = obtenirColorHex(item.colorFons, configDefecte.colorFonsDefecte);
            const text = obtenirColorHex(item.colorText, configDefecte.colorTextDefecte);
        
            bloc.style.backgroundColor = fons;
            bloc.style.borderColor = (fons.toUpperCase() === '#FFFFFF') ? 'var(--color-accent, #AC80FF)' : 'var(--color-vivid, #340094)';
        
            const urlImatge = item.imatgeId && item.imatgeId !== '#N/A' && item.imatgeId.trim() !== ''
                ? `https://drive.google.com/thumbnail?sz=w800&id=${item.imatgeId.trim()}` 
                : 'logo_mm_600.jpg';
        
            let htmlBoto = '';
            if (item.textBoto && item.linkBoto) {
                const alineacio = (item.alineacioBoto || 'Esquerra').toLowerCase().trim();
                let textAlign = 'left';
                if (alineacio === 'centre') textAlign = 'center';
                if (alineacio === 'dreta') textAlign = 'right';
        
                htmlBoto = `
                    <div style="margin-top: 1.5rem; text-align: ${textAlign};">
                        <a href="${item.linkBoto}" onclick="navegarA('${item.linkBoto}', event)" class="boto-cta estil-principal">
                            ${item.textBoto}
                        </a>
                    </div>
                `;
            }

            bloc.innerHTML = `
                <div class="caixa-imatge" style="flex: 0 0 ${amplaImatge}; max-width: ${amplaImatge};">
                    <img src="${urlImatge}" alt="${item.titol || 'Mínim Món'}">
                </div>
                <div class="caixa-text">
                    ${item.titol ? `<h2 style="color: ${text};">${item.titol}</h2>` : ''}
                    ${item.descripcio ? `<p style="color: ${text};">${item.descripcio.replace(/\n/g, '<br>')}</p>` : ''}
                    ${htmlBoto}
                </div>
            `;
        
            return bloc;
        }

        /* *************************************************************
        /* boto_cta
        /* ********************************************************** */        
        function crearBotoCTA(item) {
            const contenidor = document.createElement('div');

        /* *************************************************************
        /* carrusel_imatges
        /* ********************************************************** */        
        function crearCarruselImatges(items, opcions = {}) {
            if (!items || items.length === 0) return document.createElement('div');
        
            const primerItem = items[0] || {};
        
            let velocitatVal = opcions.velocitat || primerItem.velocitat || '5';
            velocitatVal = (parseFloat(velocitatVal) || 5) * 1000;
        
            let esBucle = true;
            const rawBucle = opcions.bucle !== undefined ? opcions.bucle : primerItem.bucle;
        
            if (rawBucle !== undefined && rawBucle !== '') {
                if (typeof rawBucle === 'boolean') {
                    esBucle = rawBucle;
                } else {
                    const valStr = rawBucle.toString().trim().toLowerCase();
                    esBucle = !(valStr === 'false' || valStr === 'no' || valStr === '0');
                }
            }
        
            let ampleContenidor = '900px';
            const valAmple = primerItem.ample;
            if (valAmple && valAmple.toString().trim() !== '' && valAmple !== '#N/A') {
                const v = valAmple.toString().trim();
                ampleContenidor = (!isNaN(v)) ? `${v}px` : v;
            }
        
            let alcadaVisor = '400px';
            const valAlcada = primerItem.altImatge;
            if (valAlcada && valAlcada.toString().trim() !== '' && valAlcada !== '#N/A') {
                const v = valAlcada.toString().trim();
                alcadaVisor = (!isNaN(v)) ? `${v}px` : v;
            }
        
            const fonsContenidor = obtenirColorHex(opcions.colorFons || primerItem.colorFons, '#24153F');
        
            const wrapper = document.createElement('div');
            wrapper.className = 'carrusel-imatges-wrapper';
            wrapper.style.backgroundColor = fonsContenidor;
            wrapper.style.maxWidth = ampleContenidor;
        
            let indexActual = 0;
            let temporitzador = null;
        
            wrapper.innerHTML = `
                <div class="carrusel-caixa-principal">
                    <button class="boto-carrusel ant" aria-label="Anterior">&#10094;</button>
                    <div class="carrusel-visor" style="height: ${alcadaVisor};">
                        <div class="carrusel-diapositives"></div>
                    </div>
                    <button class="boto-carrusel seg" aria-label="Següent">&#10095;</button>
                </div>
                <div class="carrusel-peu-text">
                    <h4 class="carrusel-titol"></h4>
                    <p class="carrusel-descripcio"></p>
                </div>
            `;
        
            const elDiapositives = wrapper.querySelector('.carrusel-diapositives');
            const elPeuText = wrapper.querySelector('.carrusel-peu-text');
            const elTitol = wrapper.querySelector('.carrusel-titol');
            const elDescripcio = wrapper.querySelector('.carrusel-descripcio');
            const btnAnt = wrapper.querySelector('.boto-carrusel.ant');
            const btnSeg = wrapper.querySelector('.boto-carrusel.seg');
        
            const obtenirEnllacValid = (item) => {
                if (!item) return '';
                const desti = (item.linkBoto || '').trim();
                if (desti === '' || desti === '#' || desti === '#N/A') return '';
                return desti;
            };
        
            items.forEach((item, idx) => {
                const slide = document.createElement('div');
                slide.className = `carrusel-slide ${idx === 0 ? 'activa' : ''}`;
        
                const urlImatge = item.imatgeId && item.imatgeId !== '#N/A' && item.imatgeId.trim() !== ''
                    ? `https://drive.google.com/thumbnail?sz=w1200&id=${item.imatgeId.trim()}`
                    : 'logo_mm_600.jpg';
        
                slide.innerHTML = `<img src="${urlImatge}" alt="${item.titol || 'Mínim Món'}">`;
        
                const enllac = obtenirEnllacValid(item);
                
                if (enllac) {
                    slide.classList.add('es-clicable');
                    slide.style.cursor = 'pointer';
                    slide.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        if (typeof navegarA === 'function') {
                            navegarA(enllac, e);
                        } else {
                            window.location.href = enllac;
                        }
                    });
                } else {
                    slide.classList.remove('es-clicable');
                    slide.style.cursor = 'default';
                }
        
                elDiapositives.appendChild(slide);
            });
        
            elPeuText.addEventListener('click', (e) => {
                const itemActual = items[indexActual] || {};
                const enllacActual = obtenirEnllacValid(itemActual);
                
                if (enllacActual) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (typeof navegarA === 'function') {
                        navegarA(enllacActual, e);
                    } else {
                        window.location.href = enllacActual;
                    }
                }
            });
        
            const mostrarDiapositiva = (index) => {
                const slides = wrapper.querySelectorAll('.carrusel-slide');
                slides.forEach((s, i) => s.classList.toggle('activa', i === index));
        
                const itemActual = items[index] || {};
                const colorText = obtenirColorHex(itemActual.colorText, '#E3D4FF');
        
                elTitol.style.color = colorText;
                elDescripcio.style.color = colorText;
                elTitol.innerText = itemActual.titol || '';
                const desc = itemActual.descripcio || '';
                elDescripcio.innerHTML = desc ? desc.replace(/\n/g, '<br>') : '';
        
                const enllacActual = obtenirEnllacValid(itemActual);
                if (enllacActual) {
                    elPeuText.classList.add('es-clicable');
                    elPeuText.style.cursor = 'pointer';
                } else {
                    elPeuText.classList.remove('es-clicable');
                    elPeuText.style.cursor = 'default';
                }
        
                if (!esBucle) {
                    btnAnt.style.opacity = index === 0 ? '0.25' : '1';
                    btnAnt.style.pointerEvents = index === 0 ? 'none' : 'auto';
        
                    btnSeg.style.opacity = index === items.length - 1 ? '0.25' : '1';
                    btnSeg.style.pointerEvents = index === items.length - 1 ? 'none' : 'auto';
                } else {
                    btnAnt.style.opacity = '1';
                    btnAnt.style.pointerEvents = 'auto';
                    btnSeg.style.opacity = '1';
                    btnSeg.style.pointerEvents = 'auto';
                }
            };
        
            const seguent = () => {
                if (indexActual < items.length - 1) {
                    indexActual++;
                } else if (esBucle) {
                    indexActual = 0;
                } else {
                    aturarAutoplay();
                    return;
                }
                mostrarDiapositiva(indexActual);
            };
        
            const anterior = () => {
                if (indexActual > 0) {
                    indexActual--;
                } else if (esBucle) {
                    indexActual = items.length - 1;
                }
                mostrarDiapositiva(indexActual);
            };
        
            const iniciarAutoplay = () => {
                if (esBucle && velocitatVal > 0) {
                    aturarAutoplay();
                    temporitzador = setInterval(seguent, velocitatVal);
                }
            };
        
            const aturarAutoplay = () => {
                if (temporitzador) {
                    clearInterval(temporitzador);
                    temporitzador = null;
                }
            };
        
            btnSeg.addEventListener('click', (e) => {
                e.stopPropagation();
                seguent();
                iniciarAutoplay();
            });
        
            btnAnt.addEventListener('click', (e) => {
                e.stopPropagation();
                anterior();
                iniciarAutoplay();
            });
        
            wrapper.addEventListener('mouseenter', aturarAutoplay);
            wrapper.addEventListener('mouseleave', iniciarAutoplay);
            wrapper.addEventListener('touchstart', aturarAutoplay, { passive: true });
        
            mostrarDiapositiva(0);
            iniciarAutoplay();
        
            return wrapper;
        }

        /* *************************************************************
        /* video_1:1, video_16:9, video_9:16
        /* ********************************************************** */
        /**
         * Transforma un enllaç de Google Drive en un enllaç directe de reproducció
         * @param {string} url - URL de Google Drive (compartida o de cerca)
         * @returns {string} - URL directa de streaming de Drive
         */

        function obtenirUrlDirectaDrive(url) {
            if (!url) return '';
            const match = url.match(/(?:id=|\/d\/|\/file\/d\/)([\w-]+)/);
            if (match && match[1]) {
                return `https://drive.google.com/uc?export=download&id=${match[1]}`;
            }
            return url;
        }       

        function obtenirUrlEmbedDrive(url) {
            if (!url) return '';
            const match = url.match(/(?:id=|\/d\/|\/file\/d\/)([\w-]+)/);
            if (match && match[1]) {
                return `https://drive.google.com/file/d/${match[1]}/preview`;
            }
            return url;
        }
