    <script>

        // Funció auxiliar per injectar l'script un cop el DOM està completat
        function carregarScriptTraduccio() {
            if (!document.getElementById('google-translate-script')) {
                const script = document.createElement('script');
                script.id = 'google-translate-script';
                script.src = '//translate.google.com/translate_a/element.js?cb=inicialitzarGoogleTranslate';
                document.body.appendChild(script);
            }
        }
        
        function inicialitzarGoogleTranslate() {
            new google.translate.TranslateElement({
                pageLanguage: 'ca',
                includedLanguages: 'es,en,fr',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }      

        function establirIdioma(lang) {
            const host = window.location.hostname;
            const domains = [host, '.' + host];
            
            if (host.includes('.')) {
                const parts = host.split('.');
                if (parts.length > 2) {
                    domains.push('.' + parts.slice(-2).join('.'));
                }
            }
        
            domains.forEach(d => {
                document.cookie = `googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=${d}`;
                document.cookie = `googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
            });
        
            if (lang === 'ca') {
                window.location.reload();
                return;
            }
        
            document.cookie = `googtrans=/ca/${lang}; path=/;`;
            document.cookie = `googtrans=/ca/${lang}; path=/; domain=.${host}`;
            window.location.reload();
        }        

        const URL_CSV_CONFIG        = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScSqZ3Oknz4LVr8OiATGxLZUTXc6EqkCRGIg1G2mxYemMvn8Bttn9w5eyV9sDVd5w4mI7kJtR7LjFt/pub?gid=0&single=true&output=csv";
        const URL_CSV_ESTRUCTURA    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScSqZ3Oknz4LVr8OiATGxLZUTXc6EqkCRGIg1G2mxYemMvn8Bttn9w5eyV9sDVd5w4mI7kJtR7LjFt/pub?gid=888628017&single=true&output=csv";
        const URL_CSV_COMPONENTS    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScSqZ3Oknz4LVr8OiATGxLZUTXc6EqkCRGIg1G2mxYemMvn8Bttn9w5eyV9sDVd5w4mI7kJtR7LjFt/pub?gid=606337148&single=true&output=csv";
        const URL_CSV_CONTINGUTS    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScSqZ3Oknz4LVr8OiATGxLZUTXc6EqkCRGIg1G2mxYemMvn8Bttn9w5eyV9sDVd5w4mI7kJtR7LjFt/pub?gid=819396845&single=true&output=csv";
        const URL_CSV_FORM_CONTACTE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScSqZ3Oknz4LVr8OiATGxLZUTXc6EqkCRGIg1G2mxYemMvn8Bttn9w5eyV9sDVd5w4mI7kJtR7LjFt/pub?gid=348010806&single=true&output=csv";
        const URL_CSV_PROJECTES     = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScSqZ3Oknz4LVr8OiATGxLZUTXc6EqkCRGIg1G2mxYemMvn8Bttn9w5eyV9sDVd5w4mI7kJtR7LjFt/pub?gid=405305768&single=true&output=csv";
        const URL_CSV_CARRUSELS     = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScSqZ3Oknz4LVr8OiATGxLZUTXc6EqkCRGIg1G2mxYemMvn8Bttn9w5eyV9sDVd5w4mI7kJtR7LjFt/pub?gid=1400064711&single=true&output=csv"

        let dadesWeb = { config: {}, estructura: [], components: {}, continguts: [], projectes: {}, carrusels: {} };

        document.addEventListener('DOMContentLoaded', () => {
            carregarDadesPagina();
        });

        const MAPA_COLORS = {
            'Primari': '#301269',
            'Vivid': '#340094',
            'Accent': '#AC80FF',
            'Suau': '#C8AAFF',
            'Clar': '#E3D4FF',
            'Fons fosc': '#24153F',
            'Blanc': '#FFFFFF',
            'Negre': '#000000'
        };
        
        function obtenirColorHex(nomColor, valorPerDefecte = '#24153F') {
            if (!nomColor || nomColor.trim() === '' || nomColor.trim() === '#N/A') {
                return valorPerDefecte;
            }
            const net = nomColor.trim();
            if (MAPA_COLORS[net]) return MAPA_COLORS[net];
            if (net.startsWith('#')) return net;
            if (/^[0-9A-F]{6}$/i.test(net)) return `#${net}`;
            return valorPerDefecte;
        }
                
        async function carregarDadesPagina() {
            try {
                const URLS = {
                    CONFIG: URL_CSV_CONFIG,
                    ESTRUCTURA: URL_CSV_ESTRUCTURA,
                    COMPONENTS: URL_CSV_COMPONENTS,
                    CONTINGUTS: URL_CSV_CONTINGUTS,
                    FORM_CONTACTE: URL_CSV_FORM_CONTACTE,
                    PROJECTES: URL_CSV_PROJECTES,
                    CARRUSELS: URL_CSV_CARRUSELS
                };
        
                const respostes = await Promise.all([
                    fetch(URLS.CONFIG).then(res => res.text()),
                    fetch(URLS.ESTRUCTURA).then(res => res.text()),
                    fetch(URLS.COMPONENTS).then(res => res.text()),
                    fetch(URLS.CONTINGUTS).then(res => res.text()),
                    fetch(URLS.FORM_CONTACTE).then(res => res.text()),
                    fetch(URLS.PROJECTES).then(res => res.text()),
                    fetch(URLS.CARRUSELS).then(res => res.text())
                ]);
        
                dadesWeb.config = parsejarCSVConfig(respostes[0]);
                dadesWeb.estructura = parsejarCSVEstructura(respostes[1]);
                dadesWeb.components = parsejarCSVComponents(respostes[2]);
                dadesWeb.continguts = parsejarCSVContinguts(respostes[3]);
                dadesWeb['FORM_CONTACTE'] = parsejarCSVContinguts(respostes[4]);
                dadesWeb.projectes = parsejarCSVProjectes(respostes[5]);
                dadesWeb.carrusels = parsejarCSVCarrusels(respostes[6]);
                
                console.log('Dades carregades correctament:', dadesWeb);

                actualitzarLogo();
                construirMenuNavegacio();
                construirPantallesWeb();
                carregarPaginaPerHash();
                carregarScriptTraduccio();

            } catch (error) {
                console.error('Error en la càrrega de dades dels CSVs:', error);
            }
        }

        function actualitzarLogo() {
            const logoId = dadesWeb.config['logo'] || dadesWeb.config['logo_id'];
            const imgElement = document.getElementById('logo-img');
            
            if (logoId && imgElement) {
                imgElement.src = `https://drive.google.com/thumbnail?sz=w600&id=${logoId.trim()}`;
            } else if (imgElement) {
                imgElement.src = 'logo_mm_600.jpg';
            }
        }

        function parseCSV(text) {
            let p = '', c = '', r = [];
            let q = false;
            let row = [''];
            for (let i = 0; i < text.length; i++) {
                c = text[i];
                p = text[i - 1];
                if (c === '"') {
                    if (q && text[i + 1] === '"') { row[row.length - 1] += '"'; i++; }
                    else { q = !q; }
                } else if (c === ',' && !q) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !q) {
                    if (c === '\r' && text[i + 1] === '\n') { i++; }
                    r.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') { r.push(row); }
            return r;
        }

        function parsejarCSVConfig(csvText) {
            const files = parseCSV(csvText);
            const config = {};
            files.slice(1).forEach(fila => {
                if (fila[0] && fila[1]) config[fila[0].trim()] = fila[1].trim();
            });
            return config;
        }

        function parsejarCSVComponents(csvText) {
            const files = parseCSV(csvText);
            const components = {};
            files.slice(1).forEach(fila => {
                const nomComponent = (fila[0] || '').trim().toLowerCase();
                if (nomComponent) {
                    components[nomComponent] = {
                        layoutDefecte: (fila[1] || '').trim(),
                        colorFonsDefecte: (fila[2] || '#FFFFFF').trim(),
                        colorTextDefecte: (fila[3] || '#24153F').trim(),
                    };
                }
            });
            return components;
        }        

        function parsejarCSVEstructura(csvText) {
            const files = parseCSV(csvText);
            return files.slice(1)
                .filter(fila => fila[0] && fila[0].trim() !== '')
                .map(fila => {
                    const titolPagina = (fila[1] || '').trim();
                    const rawHeroTitol = (fila[5] || '').trim();
                    const rawHeroText = (fila[6] || '').trim();
                    const rawHeroDestacat = (fila[7] || '').trim();
        
                    let valSpan = (fila[13] || '').trim();
                    let leftSpanCss = '0px';
                    if (valSpan !== '') {
                        let numSpan = parseInt(valSpan);
                        if (!isNaN(numSpan)) leftSpanCss = `${numSpan}px`;
                    }
        
                    let valMidaImatge = (fila[14] || '').trim();
                    let midaImatgeCss = '400px';
                    if (valMidaImatge !== '') {
                        midaImatgeCss = /^\d+$/.test(valMidaImatge) ? `${valMidaImatge}px` : valMidaImatge;
                    }
        
                    return {
                        id: (fila[0] || '').trim(),
                        titol: titolPagina,
                        ordre: parseInt(fila[2]) || 99,
                        visible: fila[3] ? fila[3].toUpperCase().trim() === 'TRUE' : true,
                        tipus: (fila[4] || 'galeria_filtrada').trim(),
                        heroTitol: rawHeroTitol !== '' ? rawHeroTitol.replace(/\n/g, '<br>') : titolPagina,
                        heroText: rawHeroText ? rawHeroText.replace(/\n/g, '<br>') : '',
                        heroDestacat: rawHeroDestacat ? rawHeroDestacat.replace(/\n/g, '<br>') : '',
                        heroImatge: (fila[8] || '').trim(), 
                        heroAmple: fila[10] && fila[10].trim() !== '' ? `${parseInt(fila[10])}px` : '550px',
                        heroAlign: fila[11] ? fila[11].toLowerCase().trim() : 'left',
                        heroFontColor: (fila[12] && fila[12].trim() !== '') ? fila[12].trim() : '#E3D4FF',
                        heroLeftSpan: leftSpanCss,
                        heroMidaImatge: midaImatgeCss,
                        navegacio: fila[15] ? fila[15].toUpperCase().trim() === 'TRUE' : true,
                        grupPagina: (fila[16] || 'principal').toLowerCase().trim()
                    };
                    
                }).sort((a, b) => a.ordre - b.ordre);
        }

        function parsejarCSVContinguts(csvText) {
            const files = parseCSV(csvText);
            return files.slice(1).map(fila => ({
                id: (fila[0] || '').trim(),
                seccio: (fila[1] || '').trim(),
                titol: (fila[2] || '').trim(),
                descripcio: (fila[3] || '').trim(),
                imatgeId: (fila[4] || '').trim(),
                link: (fila[5] || '').trim(),
                destacat: fila[6] ? fila[6].toUpperCase().trim() === 'TRUE' : false,
                tipusComponent: (fila[7] || '').trim(),
                situacioImatge: (fila[8] || 'Esquerra').trim(),
                midaImatge: (fila[9] || '').trim(),
                textBoto: (fila[10] || '').trim(),
                linkBoto: (fila[11] || '').trim(),
                alineacioBoto: (fila[12] || 'Centre').trim(),
                novaFila: fila[13] ? (fila[13].toUpperCase().trim() === 'TRUE' || fila[13].toUpperCase().trim() === 'SI') : false,
                colorFons: (fila[14] || '').trim(),
                colorText: (fila[15] || '').trim(),
                ample: (fila[16] || '').trim(),
                altImatge: (fila[17] || '').trim(),
                velocitat: (fila[18] || '').trim(),
                bucle: (fila[19] || '').trim(),
                videoAutoStart: fila[20] ? (fila[20].toUpperCase().trim() === 'TRUE' || fila[20].toUpperCase().trim() === 'SI') : false,
                videoControls: fila[21] ? (fila[21].toUpperCase().trim() !== 'NO' && fila[21].toUpperCase().trim() !== 'FALSE') : true
            })).filter(item => item.id !== '');
        }

        function parsejarCSVProjectes(csvText) {
            const files = parseCSV(csvText);
            
            // Ignorem la primera fila (capçaleres)
            return files.slice(1).map(fila => {
                // Neteja d'espais en blanc per seguretat
                const getVal = (idx) => (fila[idx] || '').trim();
                const getBool = (idx) => {
                    const val = getVal(idx).toUpperCase();
                    return val === 'SI' || val === 'TRUE' || val === 'ACTIU';
                };
        
                return {
                    idProjecte: getVal(0),
                    nomProjecte: getVal(1),
                    estat: getVal(2) || 'Actiu', // Actiu / Esborrany / Inactiu
                    ordre: getVal(3),            // Camps separats per ";"
                    
                    // Hero
                    portadaTitol: getVal(4),
                    portadaImatgeId: getVal(5),
                    // getVal(6) -> Hero_Imatge_Link (Intern, s'omet)
        
                    // Video 1
                    video1Atributs: getVal(7),
                    video1Link: getVal(8),
                    video1Titol: getVal(9),
                    video1Text: getVal(10),
                    video1Alt: getVal(11),
        
                    // Video 2
                    video2Atributs: getVal(12),
                    video2Link: getVal(13),
                    video2Titol: getVal(14),
                    video2Text: getVal(15),
                    video2Alt: getVal(16),
        
                    // ImatgeText 1
                    imatgeText1Id: getVal(17),
                    // getVal(16) -> ImatgeText1_Link (Intern, s'omet)
                    imatgeText1Titol: getVal(19),
                    imatgeText1Text: getVal(20),
                    imatge1Alt: getVal(21),
        
                    // ImatgeText 2
                    imatgeText2Id: getVal(22),
                    // getVal(20) -> ImatgeText_2_Link (Intern, s'omet)
                    imatgeText2Titol: getVal(24),
                    imatgeText2Text: getVal(25),
                    imatge2Alt: getVal(26),
        
                    // BlocText 1
                    blocText1Titol: getVal(27),
                    blocText1Text: getVal(28),
        
                    // BlocText 2
                    blocText2Titol: getVal(29),
                    blocText2Text: getVal(30),
        
                    // Opcions finals
                    carrusel: getVal(31),       // Si / No
                    carruselAlt: getVal(32),
                    galeriaActivaId: getVal(33)
                };
            }).filter(item => item.idProjecte !== '' && item.estat.toLowerCase() !== 'inactiu');
        }
        
        function parsejarCSVCarrusels(csvText) {
            if (!csvText) return {};
            
                const carruselsPerProjecte = {};
                const linies = csvText.split(/\r?\n/);
            
                // Comencem a la línia 1 per saltar la capçalera
                for (let i = 1; i < linies.length; i++) {
                    if (!linies[i].trim()) continue;
            
                    const cols = linies[i].split(',');
                    const idProjecte = cols[0] ? cols[0].trim() : '';
                    const idImatge   = cols[1] ? cols[1].trim() : '';
                    const linkImatge = cols[2] ? cols[2].trim() : '';
                    const descripcio = cols[3] ? cols[3].trim().replace(/^"|"$/g, '') : '';

                    console.log("idImatge: ", idImatge);
                    
                    if (idProjecte && linkImatge && !linkImatge.includes('#N/A')) {
                        if (!carruselsPerProjecte[idProjecte]) {
                            carruselsPerProjecte[idProjecte] = [];
                        }
                        carruselsPerProjecte[idProjecte].push({
                            ID_Imatge: idImatge,
                            Link_Imatge: linkImatge,
                            Descripcio: descripcio
                        });
                    }
                }            
            return carruselsPerProjecte;
        }

        
        function construirMenuNavegacio() {
            const menuUL = document.getElementById('menu-navegacio');
            if (!menuUL) return;
            menuUL.innerHTML = '';
            
            const paginesNavegacio = dadesWeb.estructura.filter(pagina => pagina.visible && pagina.navegacio);
            
            paginesNavegacio.forEach(pagina => {
                const li = document.createElement('li');
                li.innerHTML = `<a href="#${pagina.id}" onclick="navegarA('${pagina.id}', event); return false;">${pagina.titol}</a>`;
                menuUL.appendChild(li);
            });
        }

        // --- Ocultar el carregador de pàgina
        window.addEventListener('load', function() {
            ocultarCarregador();
        });
        
        function ocultarCarregador() {
            const loader = document.getElementById('pantalla-carrega');
            if (loader) {
                loader.classList.add('carregat');
            }
        }
        

        // --- CONSTRUCCIÓ PANTALLES WEB I SECCIÓ HERO ---
        function construirPantallesWeb() {
            const contenidorPrincipal = document.getElementById('seccions-contenidor');
            if (!contenidorPrincipal) return;
            contenidorPrincipal.innerHTML = '';
            
            const configuracioPeu = dadesWeb.continguts.find(item => {
                const tipus = item.tipusComponent ? item.tipusComponent.toLowerCase().trim() : '';
                return tipus === 'peu_de_pagina';
            }) || {};
        
            dadesWeb.estructura.forEach(pagina => {
                if (!pagina.visible) return;
        
                const seccioHTML = document.createElement('section');
                seccioHTML.id = `pantalla-${pagina.id}`;
                seccioHTML.className = `seccio-web grup-${pagina.grupPagina || 'principal'}`;
                
                const teImatge = pagina.heroImatge && pagina.heroImatge.trim() !== '' && pagina.heroImatge.trim() !== '#N/A';
                const urlHeroImatge = teImatge ? `https://drive.google.com/thumbnail?sz=w1600&id=${pagina.heroImatge.trim()}` : '';
        
                const alçadaHero = (pagina.heroMidaImatge && pagina.heroImatge.trim() !== '' && pagina.heroMidaImatge.trim() !== '#N/A') 
                    ? pagina.heroMidaImatge.trim() 
                    : '450px';
        
                const estilFons = teImatge 
                    ? `background-image: linear-gradient(to right, rgba(36, 21, 63, 0.95) 0%, rgba(36, 21, 63, 0.6) 50%, rgba(36, 21, 63, 0.15) 100%), url('${urlHeroImatge}'); background-size: cover; background-position: center;` 
                    : `background-color: var(--color-fons-fosc, #24153F);`;
        
                const htmlHero = `
                    <div class="hero-pagina" style="${estilFons} min-height: ${alçadaHero}; padding: 3rem 2rem; display: flex; align-items: center; justify-content: flex-start; box-sizing: border-box;">
                        <div class="hero-contenedor-flex" style="max-width: 1200px; width: 100%; margin: 0 auto; display: flex; align-items: center;">
                            <div class="hero-caixa-contingut" style="
                                flex: 1 1 ${pagina.heroAmple || '600px'};
                                max-width: ${pagina.heroAmple || '650px'}; 
                                transform: translateX(${pagina.heroLeftSpan || '0px'}); 
                                text-align: ${pagina.heroAlign || 'left'};
                                color: ${pagina.heroFontColor || '#FFFFFF'};">
                                
                                <h1 style="font-size: 2.5rem; font-weight: 700; color: ${pagina.heroFontColor || '#FFFFFF'}; line-height: 1.2; margin-bottom: 1rem; font-family: 'Montserrat', sans-serif;">
                                    ${pagina.heroTitol}
                                </h1>
                                
                                ${pagina.heroText ? `
                                    <div class="hero-cos-text" style="font-size: 1.15rem; font-weight: 400; color: ${pagina.heroFontColor || '#FFFFFF'}; margin-top: 1rem; line-height: 1.5; font-family: 'Montserrat', sans-serif;">
                                        ${pagina.heroText}
                                    </div>` : ''}
                                
                                ${pagina.heroDestacat ? `
                                    <div class="destacat-hero" style="font-size: 1.25rem; font-weight: 600; color: #AC80FF; margin-top: 1.2rem; font-family: 'Montserrat', sans-serif;">
                                        ${pagina.heroDestacat}
                                    </div>` : ''}
                            </div>
                        </div>
                    </div>
                `;
        
                seccioHTML.innerHTML = htmlHero;
        
                const elementsSeccio = dadesWeb.continguts.filter(item => {
                    const tipus = item.tipusComponent ? item.tipusComponent.toLowerCase().trim() : '';
                    return item.seccio === pagina.id && tipus !== 'peu_de_pagina';
                });
                
                const contenidorContinguts = document.createElement('div');
                contenidorContinguts.className = 'contenidor-continguts-seccio';
        
                if (elementsSeccio.length > 0) {
                    let contenidorFilaFlex = null;
                    let grupGaleria = [];
                    let grupCarrusel = [];
        
                    const processarGaleriaPendent = () => {
                        if (grupGaleria.length > 0) {
                            contenidorContinguts.appendChild(crearGaleriaActiva(grupGaleria));
                            grupGaleria = [];
                        }
                    };
        
                    const processarCarruselPendent = () => {
                        if (grupCarrusel.length > 0 && contenidorFilaFlex) {
                            contenidorFilaFlex.appendChild(crearCarruselImatges(grupCarrusel));
                            grupCarrusel = [];
                        }
                    };
                    
                    elementsSeccio.forEach(item => {
                        const tipus = item.tipusComponent ? item.tipusComponent.toLowerCase().trim() : '';
        
                        if (tipus !== 'galeria_activa') processarGaleriaPendent();
                        if (tipus !== 'carrusel_imatges') processarCarruselPendent();
        
                        if (tipus === 'galeria_activa') {
                            contenidorFilaFlex = null;
                            grupGaleria.push(item);
        
                        } else if (tipus === 'espaiador') {
                            contenidorFilaFlex = null;
                            const tempDiv = document.createElement('div');
                            tempDiv.style.width = '100%';
                            tempDiv.innerHTML = crearEspaiador(item);
                            contenidorContinguts.appendChild(tempDiv.firstElementChild);
        
                        } else if (tipus === 'separador') {
                            contenidorFilaFlex = null;
                            const tempDiv = document.createElement('div');
                            tempDiv.style.width = '100%';
                            tempDiv.innerHTML = crearSeparador(item);
                            contenidorContinguts.appendChild(tempDiv.firstElementChild);
        
                        } else if (tipus === 'formulari') {
                            contenidorFilaFlex = null;
                            const nomFullFormulari = item.link ? item.link.trim() : '';
                            const campsAssociats = dadesWeb[nomFullFormulari] || [];
        
                            const tempDiv = document.createElement('div');
                            tempDiv.style.width = '100%';
                            tempDiv.innerHTML = crearFormulari(item, campsAssociats);
                            contenidorContinguts.appendChild(tempDiv.firstElementChild);
        
                        } else {
                            if (item.novaFila || !contenidorFilaFlex) {
                                processarCarruselPendent();
                                
                                contenidorFilaFlex = document.createElement('div');
                                contenidorFilaFlex.className = 'contenidor-fila-flex';
                                
                                const pos = (item.situacioImatge || '').toLowerCase().trim();
                                if (pos === 'centre' || pos === 'center') {
                                    contenidorFilaFlex.classList.add('posicio-centre');
                                } else if (pos === 'dreta' || pos === 'right') {
                                    contenidorFilaFlex.classList.add('posicio-dreta');
                                } else {
                                    contenidorFilaFlex.classList.add('posicio-esquerra');
                                }
        
                                contenidorContinguts.appendChild(contenidorFilaFlex);
                            }
        
                            if (tipus === 'carrusel_imatges') {
                                grupCarrusel.push(item);
                            } else if (tipus === 'bloc_text') {
                                contenidorFilaFlex.appendChild(crearBlocText(item));
                            } else if (tipus === 'targeta_imatge_text') {
                                contenidorFilaFlex.appendChild(crearTargetaImatgeText(item));
                            } else if (tipus === 'bloc_imatge_text') {
                                contenidorFilaFlex.appendChild(crearBlocImatgeText(item));
                            } else if (tipus === 'boto_cta') {
                                contenidorFilaFlex.appendChild(crearBotoCTA(item));
                            } else if (tipus === 'video' || tipus === 'video_1:1' || tipus === 'video_16:9' || tipus === 'video_9:16') {
                                const tempDiv = document.createElement('div');
                                tempDiv.innerHTML = crearComponentVideo(item);
                                contenidorFilaFlex.appendChild(tempDiv.firstElementChild);
                            } else {
                                contenidorFilaFlex.appendChild(crearTargetaElement(item));
                            }                    
                        }
                    });
        
                    processarGaleriaPendent();
                    processarCarruselPendent();
                }
        
                const wrapperPeu = document.createElement('div');
                wrapperPeu.style.width = '100%';
                wrapperPeu.innerHTML = crearPeuPagina(configuracioPeu);
                contenidorContinguts.appendChild(wrapperPeu.firstElementChild);
        
                seccioHTML.appendChild(contenidorContinguts);
                contenidorPrincipal.appendChild(seccioHTML);
            });
        }

function canviarSeccio(nomNovaSeccio) {
    const hashNetejat = (nomNovaSeccio || '').replace('#', '').trim();
    
    // Funció interna per netejar i afegir el peu de pàgina unificat
    const renderitzarPeu = () => {
        if (typeof crearPeuPagina === 'function') {
            const htmlPeu = crearPeuPagina();
            const main = document.getElementById('seccions-contenidor') || document.body;
            
            // Eliminem qualsevol peu existent per evitar duplicats
            const peusExistents = document.querySelectorAll('.peu-pagina');
            peusExistents.forEach(p => p.remove());
            
            // Inserim el peu al final del contenidor principal
            main.insertAdjacentHTML('beforeend', htmlPeu);
        }
    };

    // 1. CAS PROJECTES
    if (
        hashNetejat.startsWith('projecte/') || 
        hashNetejat.startsWith('projectes/') || 
        hashNetejat.startsWith('pr_') ||
        hashNetejat === 'projectes'
    ) {
        if (typeof carregarPaginaProjectes === 'function') {
            // Executem la càrrega del contingut de projectes
            carregarPaginaProjectes(hashNetejat);
            
            // Utilitzem setTimeout per garantir que el peu s'injecta 
            // un cop el DOM de projectes s'ha dibuixat completament
            setTimeout(() => {
                renderitzarPeu();
            }, 50);
        }
        return; 
    }

    // 2. CAS LEGAL
    if (
        hashNetejat.startsWith('legal') || 
        hashNetejat.startsWith('avis-legal') || 
        hashNetejat.startsWith('privacitat') || 
        hashNetejat.startsWith('cookies')
    ) {
        if (typeof carregarPaginaLegal === 'function') {
            carregarPaginaLegal(hashNetejat);
            setTimeout(() => { renderitzarPeu(); }, 50);
        }
        return;
    }

    // 3. RESTA DE SECCIONS PRINCIPALS
    const seccions = document.querySelectorAll('.seccio-web');
    seccions.forEach(sec => sec.style.display = 'none');

    // Neteja de peus residuals
    const peusExistents = document.querySelectorAll('.peu-pagina');
    peusExistents.forEach(p => p.remove());

    const targetId = hashNetejat.startsWith('pantalla-') ? hashNetejat : `pantalla-${hashNetejat}`;
    const seccioDesti = document.getElementById(targetId);

    if (seccioDesti) {
        seccioDesti.style.display = 'block';
        // Inserim el peu de pàgina directament al final de la secció visible
        seccioDesti.insertAdjacentHTML('beforeend', crearPeuPagina());
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}
        
        
        function carregarPaginaLegal(idLegal) {
            const idNormalitzat = idLegal.replace(/-/g, '_');
            
            // Mapa de títols amb accents i format correcte per a la capçalera
            const titolsLegals = {
                'avis_legal': 'AVÍS LEGAL',
                'privacitat': 'POLÍTICA DE PRIVACITAT',
                'cookies': 'POLÍTICA DE COOKIES'
            };
        
            // Si tenim el títol definit al mapa, el fem servir; si no, fem servir el nom per defecte
            const nomTitol = titolsLegals[idNormalitzat] || idNormalitzat.replace('_', ' ').toUpperCase();
            const paginaData = { nomPagina: nomTitol };
        
            const contingutLegal = dadesWeb.continguts.filter(item => 
                item.seccio === idNormalitzat || item.seccio === idLegal
            );
            
            // Recuperem la configuració del peu de pàgina si existeix al CSV
            const configuracioPeu = dadesWeb.continguts.find(item => {
                const tipus = item.tipusComponent ? item.tipusComponent.toLowerCase().trim() : '';
                return tipus === 'peu_de_pagina';
            }) || {};
        
            let htmlText = contingutLegal.map(c => `<p>${c.descripcio || ''}</p>`).join('');
            if (!htmlText) {
                htmlText = `<p>Contingut legal en procés d'actualització.</p>`;
            }
        
            const main = document.getElementById('seccions-contenidor');
            if (main) {
                // Generem la pàgina legal amb el títol accentuat i el peu de pàgina
                main.innerHTML = crearPaginaLegal(paginaData, htmlText) + crearPeuPagina(configuracioPeu);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        
            if (window.location.hash !== '#' + idLegal) {
                history.pushState(null, null, '#' + idLegal);
            }
        }

        function toggleMenuMobil() {
            const menu = document.getElementById('menu-navegacio');
            if (menu) menu.classList.toggle('obert');
        }   




        function navegarA(hashDesti) {
            // Tanca el menú desplegable mòbil si està obert
            const menu = document.getElementById('menu-navegacio');
            if (menu) menu.classList.remove('obert');
                    
            // 1. Normalitzem el hash d'entrada
            const hashNetejat = hashDesti.startsWith('#') ? hashDesti : '#' + hashDesti;
            const idSeccio = hashNetejat.replace('#', '');
            
            // Seccions de la pàgina principal (amb ancoratge)
            const seccionsHome = ['univers_minim', 'mons_minims', 'la_botiga', 'el_laboratori', 'home'];
            
            // 2. Si l'usuari vol anar a una secció de la pàgina principal
            if (seccionsHome.includes(idSeccio)) {
                
                // Comprovem si actualment NO som a la pàgina principal (estem a #projectes, #avis-legal, etc.)
                const foraDeHome = window.location.hash.includes('projectes') || 
                                   window.location.hash.includes('avis-legal') || 
                                   window.location.hash.includes('privacitat') || 
                                   window.location.hash.includes('cookies');
            
                if (foraDeHome) {
                    // Actualitzem la URL
                    window.location.hash = hashNetejat;
                    
                    // Reconstruïm les seccions de la Home amb la teva funció real
                    construirPantallesWeb();
            
                    // Esperem un instant a què el DOM es dibuixi per fer el smooth scroll
                    setTimeout(() => {
                        const el = document.getElementById(idSeccio);
                        if (el) {
                            el.scrollIntoView({ behavior: 'smooth' });
                        } else {
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        }
                    }, 100);
            
                } else {
                    // Si JA som a la Home, només actualitzem hash i fem scroll
                    window.location.hash = hashNetejat;
                    const el = document.getElementById(idSeccio);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth' });
                    }
                }
            
            } else {
                // Per a rutes independents (#projectes/pr-0001, legals, etc.)
                window.location.hash = hashNetejat;
            }
        }
            
        function carregarPaginaPerHash() {
            let hash = window.location.hash.replace('#', '').trim();
            if (!hash) {
                activarSeccioInicial();
            } else {
                canviarSeccio(hash);
            }
        }
    
        window.addEventListener('hashchange', carregarPaginaPerHash);

        function crearTargetaElement(item) {
            const card = document.createElement('div');
            
            const configDefecte = dadesWeb.components['targeta_imatge_text'] || {
                colorFonsDefecte: '#24153F',
                colorTextDefecte: '#E3D4FF'
            };
            const fons = obtenirColorHex(item.colorFons, configDefecte.colorFonsDefecte);
            const text = obtenirColorHex(item.colorText, configDefecte.colorTextDefecte);
        
            let ampleCard = '280px';
            if (item.ample && item.ample.trim() !== '' && item.ample.trim() !== '#N/A') {
                const v = item.ample.trim();
                ampleCard = (!isNaN(v)) ? `${v}px` : v;
            }
        
            let alcadaImg = '200px';
            if (item.altImatge && item.altImatge.trim() !== '' && item.altImatge.trim() !== '#N/A') {
                const v = item.altImatge.trim();
                alcadaImg = (!isNaN(v)) ? `${v}px` : v;
            }
        
            card.style.backgroundColor = fons;
            card.style.width = ampleCard;
            card.style.flex = `0 1 ${ampleCard}`;
        
            const urlImatge = item.imatgeId && item.imatgeId !== '#N/A' && item.imatgeId.trim() !== ''
                ? `https://drive.google.com/thumbnail?sz=w800&id=${item.imatgeId.trim()}`
                : 'logo_mm_300.jpg';
        
            const enllac = item.linkBoto ? item.linkBoto.trim() : '';
            const teEnllac = enllac !== '' && enllac !== '#';
        
            if (teEnllac) {
                card.className = 'targeta-imatge-text es-clicable';
                card.onclick = (e) => navegarA(enllac, e);

                card.className = 'targeta-imatge-text es-estatica';
                card.onclick = null;

        function crearCarruselImatges(items, opcions = {}) {
            if (!items || items.length === 0) return document.createElement('div');
        
            const primerItem = items[0] || {};
            let velocitatVal = opcions.velocitat || primerItem.velocitat || '5';
            velocitatVal = (parseFloat(velocitatVal) || 5) * 1000;
        
            let esBucle = true;
            const rawBucle = opcions.bucle !== undefined ? opcions.bucle : primerItem.bucle;
            if (rawBucle !== undefined && rawBucle !== '') {
                if (typeof rawBucle === 'boolean') {
                    esBucle = rawBucle;
                } else {
                    const valStr = rawBucle.toString().trim().toLowerCase();
                    esBucle = !(valStr === 'false' || valStr === 'no' || valStr === '0');
                }
            }
        
            let ampleContenidor = '900px';
            const valAmple = primerItem.ample;
            if (valAmple && valAmple.toString().trim() !== '' && valAmple !== '#N/A') {
                const v = valAmple.toString().trim();
                ampleContenidor = (!isNaN(v)) ? `${v}px` : v;
            }
        
            let alcadaVisor = '400px';
            const valAlcada = primerItem.altImatge;
            if (valAlcada && valAlcada.toString().trim() !== '' && valAlcada !== '#N/A') {
                const v = valAlcada.toString().trim();
                alcadaVisor = (!isNaN(v)) ? `${v}px` : v;
            }
        
            const fonsContenidor = obtenirColorHex(opcions.colorFons || primerItem.colorFons, '#24153F');
        
            const wrapper = document.createElement('div');
            wrapper.className = 'carrusel-imatges-wrapper';
            wrapper.style.backgroundColor = fonsContenidor;
            wrapper.style.maxWidth = ampleContenidor;
        
            let indexActual = 0;
            let temporitzador = null;
        
            wrapper.innerHTML = `
                <div class="carrusel-caixa-principal">
                    <button class="boto-carrusel ant" aria-label="Anterior">&#10094;</button>
                    <div class="carrusel-visor" style="height: ${alcadaVisor};">
                        <div class="carrusel-diapositives"></div>
                    </div>
                    <button class="boto-carrusel seg" aria-label="Següent">&#10095;</button>
                </div>
                <div class="carrusel-peu-text">
                    <h4 class="carrusel-titol"></h4>
                    <p class="carrusel-descripcio"></p>
                </div>
            `;
        
            const elDiapositives = wrapper.querySelector('.carrusel-diapositives');
            const elPeuText = wrapper.querySelector('.carrusel-peu-text');
            const elTitol = wrapper.querySelector('.carrusel-titol');
            const elDescripcio = wrapper.querySelector('.carrusel-descripcio');
            const btnAnt = wrapper.querySelector('.boto-carrusel.ant');
            const btnSeg = wrapper.querySelector('.boto-carrusel.seg');
        
            const obtenirEnllacValid = (item) => {
                if (!item) return '';
                const desti = (item.linkBoto || '').trim();
                if (desti === '' || desti === '#' || desti === '#N/A') return '';
                return desti;
            };
        
            items.forEach((item, idx) => {
                const slide = document.createElement('div');
                slide.className = `carrusel-slide ${idx === 0 ? 'activa' : ''}`;
        
                const urlImatge = item.imatgeId && item.imatgeId !== '#N/A' && item.imatgeId.trim() !== ''
                    ? `https://drive.google.com/thumbnail?sz=w1200&id=${item.imatgeId.trim()}`
                    : 'logo_mm_600.jpg';
        
                slide.innerHTML = `<img src="${urlImatge}" alt="${item.titol || 'Mínim Món'}">`;
        
                const enllac = obtenirEnllacValid(item);
                if (enllac) {
                    slide.classList.add('es-clicable');
                    slide.style.cursor = 'pointer';
                    slide.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        if (typeof navegarA === 'function') navegarA(enllac, e);
                        else window.location.href = enllac;
                    });
                } else {
                    slide.classList.remove('es-clicable');
                    slide.style.cursor = 'default';
                }
                elDiapositives.appendChild(slide);
            });
        
            elPeuText.addEventListener('click', (e) => {
                const itemActual = items[indexActual] || {};
                const enllacActual = obtenirEnllacValid(itemActual);
                if (enllacActual) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (typeof navegarA === 'function') navegarA(enllacActual, e);
                    else window.location.href = enllacActual;
                }
            });
        
            const mostrarDiapositiva = (index) => {
                const slides = wrapper.querySelectorAll('.carrusel-slide');
                slides.forEach((s, i) => s.classList.toggle('activa', i === index));
        
                const itemActual = items[index] || {};
                const colorText = obtenirColorHex(itemActual.colorText, '#E3D4FF');
        
                elTitol.style.color = colorText;
                elDescripcio.style.color = colorText;
                elTitol.innerText = itemActual.titol || '';
                const desc = itemActual.descripcio || '';
                elDescripcio.innerHTML = desc ? desc.replace(/\n/g, '<br>') : '';
        
                const enllacActual = obtenirEnllacValid(itemActual);
                if (enllacActual) {
                    elPeuText.classList.add('es-clicable');
                    elPeuText.style.cursor = 'pointer';
                } else {
                    elPeuText.classList.remove('es-clicable');
                    elPeuText.style.cursor = 'default';
                }
        
                if (!esBucle) {
                    btnAnt.style.opacity = index === 0 ? '0.25' : '1';
                    btnAnt.style.pointerEvents = index === 0 ? 'none' : 'auto';
                    btnSeg.style.opacity = index === items.length - 1 ? '0.25' : '1';
                    btnSeg.style.pointerEvents = index === items.length - 1 ? 'none' : 'auto';
                } else {
                    btnAnt.style.opacity = '1';
                    btnAnt.style.pointerEvents = 'auto';
                    btnSeg.style.opacity = '1';
                    btnSeg.style.pointerEvents = 'auto';
                }
            };
        
            const seguent = () => {
                if (indexActual < items.length - 1) indexActual++;
                else if (esBucle) indexActual = 0;
                else { aturarAutoplay(); return; }
                mostrarDiapositiva(indexActual);
            };
        
            const anterior = () => {
                if (indexActual > 0) indexActual--;
                else if (esBucle) indexActual = items.length - 1;
                mostrarDiapositiva(indexActual);
            };
        
            const iniciarAutoplay = () => {
                if (esBucle && velocitatVal > 0) {
                    aturarAutoplay();
                    temporitzador = setInterval(seguent, velocitatVal);
                }
            };
        
            const aturarAutoplay = () => {
                if (temporitzador) {
                    clearInterval(temporitzador);
                    temporitzador = null;
                }
            };
        
            btnSeg.addEventListener('click', (e) => { e.stopPropagation(); seguent(); iniciarAutoplay(); });
            btnAnt.addEventListener('click', (e) => { e.stopPropagation(); anterior(); iniciarAutoplay(); });
            wrapper.addEventListener('mouseenter', aturarAutoplay);
            wrapper.addEventListener('mouseleave', iniciarAutoplay);
            wrapper.addEventListener('touchstart', aturarAutoplay, { passive: true });
        
            mostrarDiapositiva(0);
            iniciarAutoplay();
            return wrapper;
        }

            return `

                    <form id="${formId}" onsubmit="enviarFormulariMinimMon(event, '${formId}')">

                        <div class="boto-enviar-container" style="margin-top: 1.5rem; text-align: center;">
                            <button type="submit" class="boto-enviar" style="background: #340094; color: #FFF; padding: 0.8rem 2rem; border: 1px solid #AC80FF; border-radius: 6px; font-weight: 600; cursor: pointer; font-family: 'Montserrat', sans-serif;">Enviar sol·licitud</button>
                        </div>
                    </form>
                </div>
            `;
        }
        
        const URL_GOOGLE_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwUuqy0X4UdDPNqrzKgA9Pp1eve2n27Vji8yjbkXHmYHTOaUWdVoo0fLGcKOunzw-fe3w/exec";
        const MAX_FILE_SIZE_MB = 20;
        const MAX_FILE_SIZE_BYTES = MAX_FILE_SIZE_MB * 1024 * 1024;
        
        async function enviarFormulariMinimMon(event, formId) {
            event.preventDefault();
            const formulari = document.getElementById(formId);
            if (!formulari) return;
        
            const inputsFitxer = formulari.querySelectorAll('input[type="file"]');
            for (let input of inputsFitxer) {
                if (input.files && input.files[0]) {
                    const fitxer = input.files[0];
                    if (fitxer.size > MAX_FILE_SIZE_BYTES) {
                        alert(`El fitxer "${fitxer.name}" supera el límit màxim permès de ${MAX_FILE_SIZE_MB} MB. Si us plau, tria un fitxer més lleuger.`);
                        input.value = "";
                        return;
                    }
                }
            }
        
            const botoSubmit = formulari.querySelector('button[type="submit"]');
            if (botoSubmit) {
                botoSubmit.disabled = true;
                botoSubmit.innerText = "Enviant...";
            }
        
            const formData = new FormData(formulari);
            const dadesForm = {};
            let fitxerAdjunt = null;
        
            try {
                for (let [clau, valor] of formData.entries()) {
                    if (valor instanceof File && valor.name && valor.size > 0) {
                        fitxerAdjunt = await convertirFitxerABase64(valor);
                    } else if (!(valor instanceof File)) {
                        dadesForm[clau] = valor;
                    }
                }
        
                const payload = {
                    camps: dadesForm,
                    fitxer: fitxerAdjunt
                };
        
                await fetch(URL_GOOGLE_APPS_SCRIPT, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
        
                alert("Moltes gràcies! La teva sol·licitud s'ha enviat correctament a Mínim Món.");
                formulari.reset();
        
                if (window.history && window.history.replaceState) {
                    window.history.replaceState(null, '', window.location.pathname);
                }
        
            } catch (error) {
                console.error("Error en l'enviament:", error);
                alert("S'ha produït un error en enviar el formulari. Contacta directament a info@minimmon.cat");
            } finally {
                if (botoSubmit) {
                    botoSubmit.disabled = false;
                    botoSubmit.innerText = "Enviar sol·licitud";
                }
            }
        }
        
        function convertirFitxerABase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve({
                    nom: file.name,
                    tipus: file.type,
                    base64: reader.result.split(',')[1]
                });
                reader.onerror = error => reject(error);
            });
        }

        function gestionarCanviFitxer(input, idCamp) {
            const botoPaperera = document.getElementById(`boto-netejar-${idCamp}`);
            if (!botoPaperera) return;
        
            if (input.files && input.files.length > 0) {
                botoPaperera.style.display = 'inline-flex';
                if (input.files[0].size > MAX_FILE_SIZE_BYTES) {
                    alert(`El fitxer "${input.files[0].name}" supera el límit de ${MAX_FILE_SIZE_MB} MB.`);
                    netejarCampFitxer(idCamp);
                }
            } else {
                botoPaperera.style.display = 'none';
            }
        }
        
        function netejarCampFitxer(idCamp) {
            const input = document.getElementById(idCamp);
            const botoPaperera = document.getElementById(`boto-netejar-${idCamp}`);
            
            if (input) {
                input.value = '';
            }
            if (botoPaperera) {
                botoPaperera.style.display = 'none';
            }
        }

// Funció principal adaptada al parser del CSV de Projectes
function crearPaginaProjectes(idProjecte, llistaProjectes = []) {
    const idNeta = (idProjecte || '').replace('#', '').replace('projecte/', '').replace('projectes/', '').trim();
    console.log("🔍 Cerca de projecte per ID neta:", idNeta);

    const projecte = llistaProjectes.find(p => p.idProjecte === idNeta) || llistaProjectes[0];

    if (!projecte) {
        console.error("❌ No s'ha trobat cap projecte a la llista.");
        return `<div style="padding: 4rem; text-align: center;"><h2>Projecte no trobat</h2></div>`;
    }

    // Ordre per defecte si no s'especifica al CSV
    const ordresRaw = projecte.ordre && projecte.ordre.trim() !== '' ? projecte.ordre : 'Portada;Video_1';
    console.log("ordresRaw: ", ordresRaw);
    const ordres = ordresRaw.split(';').map(o => o.trim());
    console.log("ordres: ", ordres);

    let htmlFinal = `<article class="pantalla-projecte-singular" data-id="${projecte.idProjecte}">`;

    ordres.forEach(bloc => {
        const blocNom = bloc.toLowerCase().replace(/_/g, '');
        console.log("blocNom: ", blocNom);
        
        // Extracció dinàmica de l'índex numèric (Ex: "video1" -> 1, "imatgetext2" -> 2)
        const numExtret = bloc.match(/\d+/);
        const numeroBloc = numExtret ? parseInt(numExtret[0], 10) : 1;

        if (blocNom.startsWith('portada') || blocNom.startsWith('hero')) {
            htmlFinal += renderitzarBlocPortada(projecte);
        } 
        else if (blocNom.startsWith('video')) {
            htmlFinal += renderitzarBlocVideo(projecte, numeroBloc);
        } 
        else if (blocNom.startsWith('imatgetext') || blocNom.startsWith('imatge')) {
            htmlFinal += renderitzarBlocImatgeText(projecte, numeroBloc);
        }
        else if (blocNom.startsWith('bloctext')) {
            htmlFinal += renderitzarBlocText(projecte, numeroBloc);
        }
        else if (blocNom.startsWith('carrusel')) {
            htmlFinal += renderitzarCarrusel(projecte, dadesWeb.carrusels);
        }
        
        console.log(`🧩 Processat bloc: ${bloc} -> Tipus: ${blocNom} | Ídem/Número: ${numeroBloc}`);
    });

    htmlFinal += `</article>`;
    return htmlFinal;
}

/**
 * Renderitza el component carruselProjecte per a un projecte concret.
 * S'encarrega de comprovar si el projecte té activat el carrusel ("Si")
 * i si disposa d'imatges carregades des del full "Carrusels".
 * 
 * @param {Object} projecte - Objecte del projecte (llegit de la fila de Sheets)
 * @param {Object} mapCarrusels - Mapa d'imatges per ID_Projecte obtingut amb parsejarCSVCarrusels
 * @returns {string} HTML renderitzat del carrusel o cadena buida si no correspon
 */
/**
 * Renderitza el carrusel d'un projecte.
 */
function renderitzarCarrusel(projecte, mapCarrusels) {
    if (!projecte) {
        console.warn("⚠️ [Carrusel Debug] 'projecte' és null o undefined");
        return '';
    }

    console.log("🔍 [Carrusel Debug] Dades rebudes:", { projecte, mapCarrusels });
    
    // 1. Lectura robusta de l'ID del projecte (cobreix idProjecte, ID_Projecte i id)
    const idProjecte = projecte.idProjecte || projecte.ID_Projecte || projecte.id || '';
    
    // 2. Comprovació del camp 'carrusel'
    const teCarrusel = projecte.carrusel && projecte.carrusel.toString().trim().toLowerCase() === 'si';

    // 3. Validació de seguretat
    console.log(`🔍 [Carrusel Debug] ID: ${idProjecte} | camp carrusel: "${projecte.carrusel}" -> teCarrusel: ${teCarrusel}`);

    if (!teCarrusel) {
        console.warn("⚠️ [Carrusel Debug] Aturat: El camp 'carrusel' a Sheets no és 'Si'");
        return '';
    }

    if (!idProjecte || !mapCarrusels) {
        console.warn("⚠️ [Carrusel Debug] Aturat: Falta idProjecte o mapCarrusels");
        return '';
    }
    
    if (!teCarrusel || !idProjecte || !mapCarrusels || typeof mapCarrusels !== 'object') {
        return '';
    }

    // 4. Obtenció de les imatges del mapa
    const llistaImatges = mapCarrusels[idProjecte];
    if (!llistaImatges || llistaImatges.length === 0) {
        console.warn(`⚠️ [Carrusel Debug] Aturat: No s'han trobat imatges al mapCarrusels per a l'ID ${idProjecte}`);
        return '';
    }

    const carruselAlt = projecte.carruselAlt || 380;

    console.log("Alt carrusel: ",carruselAlt);
    
    return crearComponentCarruselProjecte(llistaImatges, carruselAlt, idProjecte);
}


/**
 * Genera el component de carrusel de projectes amb Autoplay integrat
 */
function crearComponentCarruselProjecte(llistaImatges, carruselAlt, idUnic) {
    if (!llistaImatges || llistaImatges.length === 0) return '';

    // Processat de l'alçada
    let altCalculada = 380;
    if (carruselAlt) {
        const numExtret = parseInt(carruselAlt.toString().replace(/[^0-9]/g, ''), 10);
        if (!isNaN(numExtret) && numExtret > 0) {
            altCalculada = numExtret;
        }
    }

    const ampleVisorCalculat = Math.round(altCalculada * 1.33);
    
    const slidesHTML = llistaImatges.map((img, idx) => {
        const idImg = img.Id_Imatge || img.id_imatge || img.ID_Imatge || img.Id || '';
        const rawLink = img.Link_Imatge || img.link || '';
        
        let urlFinal = 'logo_mm_600.jpg';
        
        if (idImg && idImg.trim() !== '' && idImg !== '#N/A') {
            urlFinal = `https://drive.google.com/thumbnail?sz=w1200&id=${idImg.trim()}`;
        } else if (rawLink && rawLink.includes('id=')) {
            const match = rawLink.match(/id=([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                urlFinal = `https://drive.google.com/thumbnail?sz=w1200&id=${match[1]}`;
            }
        }

        const altText = img.Descripcio || img.descripcio || 'Imatge del projecte Mínim Món';

        return `
            <div class="carrusel-projecte-slide-item ${idx === 0 ? 'activa' : ''}" data-index="${idx}">
                <img src="${urlFinal}" alt="${altText.replace(/"/g, '&quot;')}" />
            </div>
        `;
    }).join('');
        
    const descripcioInicial = llistaImatges[0]?.Descripcio || llistaImatges[0]?.descripcio || '';
    const arrayDescripcions = llistaImatges.map(i => i.Descripcio || i.descripcio || '');
    const JSONDescripcions = JSON.stringify(arrayDescripcions).replace(/"/g, '&quot;');

    return `
        <div class="seccio-carrusel-projecte-targeta" 
             id="carrusel-projecte-wrapper-${idUnic}"
             onmouseenter="pararAutoplay()" 
             onmouseleave="iniciarAutoplay('${idUnic}', ${llistaImatges.length})">
            
            <div class="targeta-carrusel-projecte-contenidor">
                
                <div class="columna-carrusel-projecte-visor" style="height: ${altCalculada}px; width: ${ampleVisorCalculat}px;">
                    ${llistaImatges.length > 1 ? `
                        <button class="boto-carrusel-projecte-nav anterior" onclick="moureCarruselProjecte('${idUnic}', -1)">&#10094;</button>
                        <button class="boto-carrusel-projecte-nav seguent" onclick="moureCarruselProjecte('${idUnic}', 1)">&#10095;</button>
                    ` : ''}
                    ${slidesHTML}
                </div>

                <div class="columna-carrusel-projecte-descripcio">
                    <p class="text-carrusel-projecte-descripcio" id="carrusel-projecte-desc-${idUnic}" data-descripcions="${JSONDescripcions}">
                        ${descripcioInicial}
                    </p>
                </div>

            </div>

            <!-- Inicia l'autoplay un cop l'element està carregat a la pàgina -->
            ${llistaImatges.length > 1 ? `
                <script>
                    setTimeout(function() {
                        if (typeof iniciarAutoplay === 'function') {
                            iniciarAutoplay('${idUnic}', ${llistaImatges.length});
                        }
                    }, 150);
                <\/script>
            ` : ''}
        </div>
    `;
}

/* ==========================================================================
   LÒGICA DE NAVEGACIÓ I TEMPORITZADOR AUTOMÀTIC (AUTOPLAY)
   ========================================================================== */

let carruselTimer = null;
const CADENCIA_MS = 4000; // Cadència de 4 segons entre imatges

/**
 * Mou la diapositiva i actualitza el text descriptiu
 */
function moureCarruselProjecte(idUnic, direccio) {
    const contenidor = document.getElementById(`carrusel-projecte-wrapper-${idUnic}`);
    if (!contenidor) return;

    const slides = contenidor.querySelectorAll('.carrusel-projecte-slide-item');
    if (!slides.length) return;

    let indexActiu = Array.from(slides).findIndex(s => s.classList.contains('activa'));
    if (indexActiu === -1) indexActiu = 0;

    slides[indexActiu].classList.remove('activa');

    let nouIndex = (indexActiu + direccio + slides.length) % slides.length;
    slides[nouIndex].classList.add('activa');

    const textEl = document.getElementById(`carrusel-projecte-desc-${idUnic}`);
    if (textEl && textEl.dataset.descripcions) {
        try {
            const llistaDesc = JSON.parse(textEl.dataset.descripcions);
            if (llistaDesc[nouIndex] !== undefined) {
                textEl.textContent = llistaDesc[nouIndex];
            }
        } catch (e) {
            console.error("Error en processar la descripció:", e);
        }
    }

    reiniciarAutoplay(idUnic, slides.length);
}

/**
 * Inicia el temporitzador de desplaçament automàtic
 */
function iniciarAutoplay(idUnic, totalSlides) {
    if (totalSlides <= 1) return;
    
    pararAutoplay();
    carruselTimer = setInterval(() => {
        moureCarruselProjecte(idUnic, 1);
    }, CADENCIA_MS);
}

/**
 * Atura el temporitzador de l'Autoplay
 */
function pararAutoplay() {
    if (carruselTimer) {
        clearInterval(carruselTimer);
        carruselTimer = null;
    }
}

/**
 * Reinicia el temporitzador des de zero quan l'usuari interactua
 */
function reiniciarAutoplay(idUnic, totalSlides) {
    pararAutoplay();
    iniciarAutoplay(idUnic, totalSlides);
}
        
    </script>
