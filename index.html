<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mínim Món | Recreacions Simbòliques i Fusta Làser</title>
    <!-- CSS Extern -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main id="seccions-contenidor">
        <!-- El contingut es genera dinàmicament des de Google Sheets -->
    </main>

    <script>
        // Lloc de les dades de Google Sheets (Appscript / API endpoint)
        const URL_DADES = 'AQUÍ_LA_TEVA_URL_DE_APPS_SCRIPT';

        let dadesWeb = {
            config: {},
            estructura: [],
            continguts: []
        };

        // Carregar dades inicials
        document.addEventListener('DOMContentLoaded', () => {
            carregarDadesPàgina();
        });

        function carregarDadesPàgina() {
            fetch(URL_DADES)
                .then(resposta => resposta.json())
                .then(dades => {
                    dadesWeb.config = dades.config || {};
                    dadesWeb.estructura = parsejarEstructura(dades.estructura || []);
                    dadesWeb.continguts = dades.continguts || [];

                    construirPantallesWeb();
                    activarSeccioInicial();
                })
                .catch(error => console.error("Error carregant les dades de Mínim Món:", error));
        }

        // Parsejar la pestanya Estructura fins a la Columna N (HeroLeftSpan)
        function parsejarEstructura(files) {
            return files.slice(1).map(fila => {
                return {
                    id: fila[0],
                    titol: fila[1],
                    ordre: parseInt(fila[2]) || 99,
                    visible: fila[3] ? fila[3].toUpperCase() === 'TRUE' : true,
                    tipus: fila[4] || 'galeria_filtrada',
                    heroTitol: (fila[5] || '').replace(/\n/g, '<br>'),
                    heroText: (fila[6] || '').replace(/\n/g, '<br>'),
                    heroDestacat: (fila[7] || '').replace(/\n/g, '<br>'),
                    heroImatge: fila[8] || '', 
                    heroAmple: fila[10] ? `${parseInt(fila[10])}px` : '100%', // Columna K
                    heroAlign: fila[11] ? fila[11].toLowerCase() : 'center',  // Columna L
                    heroFontColor: fila[12] || '#FFFFFF',                    // Columna M
                    heroLeftSpan: fila[13] ? `${parseInt(fila[13])}%` : '0%'  // Columna N
                };
            }).sort((a, b) => a.ordre - b.ordre);
        }

        // Construeix l'esquelet HTML de la web
        function construirPantallesWeb() {
            const contenidorPrincipal = document.getElementById('seccions-contenidor');
            contenidorPrincipal.innerHTML = '';
            
            // Mides i gruixos de font des de Config
            const titolMida = dadesWeb.config['font_hero_titol_mida'] ? `${dadesWeb.config['font_hero_titol_mida']}px` : '36px';
            const titolWeight = obtenirFontWeight(dadesWeb.config['font_hero_titol_gruix']);
            
            const textMida = dadesWeb.config['font_hero_text_mida'] ? `${dadesWeb.config['font_hero_text_mida']}px` : '14px';
            const textWeight = obtenirFontWeight(dadesWeb.config['font_hero_text_gruix']);
            
            const destacatMida = dadesWeb.config['font_hero_destacat_mida'] ? `${dadesWeb.config['font_hero_destacat_mida']}px` : '14px';
            const destacatWeight = obtenirFontWeight(dadesWeb.config['font_hero_destacat_gruix']);

            dadesWeb.estructura.forEach(pagina => {
                if (!pagina.visible) return;

                const seccioHTML = document.createElement('section');
                seccioHTML.id = `pantalla-${pagina.id}`;
                seccioHTML.className = 'seccio-web';
                
                // 1. DISSENY HERO AMB ELS PARÀMETRES DE LES COLUMNES K, L, M, N
                if (pagina.heroImatge) {
                    const urlHeroImatge = `https://drive.google.com/thumbnail?sz=w1600&id=${pagina.heroImatge}`;

                    seccioHTML.innerHTML = `
                        <div class="hero-pagina" style="background-image: url('${urlHeroImatge}');">
                            <div class="hero-contenedor-flex">
                                <div class="hero-caixa-contingut" style="
                                    max-width: ${pagina.heroAmple}; 
                                    margin-left: ${pagina.heroLeftSpan}; 
                                    text-align: ${pagina.heroAlign}; 
                                    color: ${pagina.heroFontColor};">
                                    
                                    <h2 style="font-size: ${titolMida}; font-weight: ${titolWeight}; color: ${pagina.heroFontColor};">${pagina.heroTitol || pagina.titol}</h2>
                                    <p style="font-size: ${textMida}; font-weight: ${textWeight}; color: ${pagina.heroFontColor}; margin-top: 1rem;">${pagina.heroText}</p>
                                    ${pagina.heroDestacat ? `<p class="destacat-hero" style="font-size: ${destacatMida}; font-weight: ${destacatWeight}; color: ${pagina.heroFontColor}; margin-top: 1.5rem;">${pagina.heroDestacat}</p>` : ''}
                                
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    seccioHTML.innerHTML = `<h1>${pagina.titol}</h1>`;
                }
                
                // 2. CONTINGUT ESPECÍFIC DE CADA SECCIÓ
                const elementsSeccio = dadesWeb.continguts.filter(item => item.seccio === pagina.id);

                if (pagina.tipus === 'galeria_filtrada' || pagina.tipus === 'home') {
                    if (elementsSeccio.length > 0) {
                        const graella = document.createElement('div');
                        graella.className = 'galeria-graella';
                        elementsSeccio.forEach(item => graella.appendChild(crearTargetaElement(item)));
                        seccioHTML.appendChild(graella);
                    }
                } else if (pagina.tipus === 'formulari') {
                    seccioHTML.innerHTML += `
                        <p style="text-align:center; margin:0 auto 2rem auto; color: var(--color-suau);">Tens una idea o un espai que t'agradaria encapsular en fusta? Connectem.</p>
                        <form class="formulari-net" onsubmit="event.preventDefault(); alert('Gràcies per connectar! Aviat rebràs resposta de Mínim Món.');">
                            <div class="grup-formulari">
                                <label>El teu nom</label>
                                <input type="text" required placeholder="Ex. Jordi">
                            </div>
                            <div class="grup-formulari">
                                <label>Correu electrònic</label>
                                <input type="email" required placeholder="nom@correu.com">
                            </div>
                            <div class="grup-formulari">
                                <label>Quina història vols explicar?</label>
                                <textarea rows="5" required placeholder="Explica'm breument la teva idea..."></textarea>
                            </div>
                            <button type="submit" class="boto-accio" style="width: 100%;">Enviar Proposta</button>
                        </form>
                    `;
                }
                
                contenidorPrincipal.appendChild(seccioHTML);
            });
        }

        // Targeta individual per a galeries
        function crearTargetaElement(item) {
            const card = document.createElement('div');
            card.className = 'targeta-element';
            
            const urlImatge = item.imatgeId ? `https://drive.google.com/thumbnail?sz=w800&id=${item.imatgeId}` : 'https://via.placeholder.com/300x200';

            card.innerHTML = `
                <img src="${urlImatge}" alt="${item.titol}">
                <h3 style="color: var(--color-clar); font-size: 1.1rem; margin-bottom: 0.5rem;">${item.titol}</h3>
                <p style="color: var(--color-suau); font-size: 0.85rem;">${item.descripcio || ''}</p>
            `;
            return card;
        }

        // Funció auxiliar de pes de font
        function obtenirFontWeight(textGruix) {
            if (!textGruix) return '400';
            const t = textGruix.toString().toLowerCase();
            if (t.includes('bold') || t.includes('negreta')) return '700';
            if (t.includes('medium') || t.includes('mitjana')) return '500';
            if (t.includes('light') || t.includes('fina')) return '300';
            return '400';
        }

        // Canviar de seccio (Navegació)
        function canviarSeccio(idSeccio) {
            document.querySelectorAll('.seccio-web').forEach(s => s.classList.remove('activa'));
            const seccioDesti = document.getElementById(`pantalla-${idSeccio}`);
            if (seccioDesti) {
                seccioDesti.classList.add('activa');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function activarSeccioInicial() {
            if (dadesWeb.estructura.length > 0) {
                canviarSeccio(dadesWeb.estructura[0].id);
            }
        }
    </script>
</body>
</html>
