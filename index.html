<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mínim Món | Recreacions Simbòliques</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="components.css">
    <!-- Font Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpg" href="logo_mm_300.jpg">
</head>
<body>

    <!-- Pantalla de Càrrega (Preloader Mínim Món) -->
    <div id="pantalla-carrega" class="carregador-overlay">
        <div class="carregador-contingut">
            <div class="logo-loader-wrap">
                <img src="logo_mm_300.jpg" alt="Mínim Món Loading" class="logo-carrega">
            </div>
            <div class="spinner-minim"></div>
            <p class="text-carrega">Creant espais...</p>
        </div>
    </div>

    <!-- BARRA DE NAVEGACIÓ SUPERIOR -->
    <header class="nav-principal">
        <div class="nav-contenidor">
            <button class="btn-hamburguesa" id="btn-hamburguesa" aria-label="Obrir menú" onclick="toggleMenuMobil()">
                <span></span>
                <span></span>
                <span></span>
            </button>
    
            <a href="#" class="logo-link" onclick="activarSeccioInicial(); return false;">
                <img id="logo-img" src="logo_mm_300.jpg" alt="Logo Mínim Món" class="logo-imatge">
                <span class="nom-marca" translate="no">Mínim Món [0088]</span>
            </a>
    
            <ul id="menu-navegacio" class="menu-links">
                <!-- Es construeix des de Google Sheets segons la navegació principal -->
            </ul>
        </div>
    </header>

    <main id="seccions-contenidor">
        <!-- Contingut dinàmic integrat per grups de pàgina -->
    </main>

    <script>
        // Funció auxiliar per injectar l'script un cop el DOM està completat
        function carregarScriptTraduccio() {
            if (!document.getElementById('google-translate-script')) {
                const script = document.createElement('script');
                script.id = 'google-translate-script';
                script.src = '//translate.google.com/translate_a/element.js?cb=inicialitzarGoogleTranslate';
                document.body.appendChild(script);
            }
        }
        
        function inicialitzarGoogleTranslate() {
            new google.translate.TranslateElement({
                pageLanguage: 'ca',
                includedLanguages: 'es,en,fr',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }      

        function establirIdioma(lang) {
            const host = window.location.hostname;
            const domains = [host, '.' + host];
            
            if (host.includes('.')) {
                const parts = host.split('.');
                if (parts.length > 2) {
                    domains.push('.' + parts.slice(-2).join('.'));
                }
            }
        
            domains.forEach(d => {
                document.cookie = `googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=${d}`;
                document.cookie = `googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
            });
        
            if (lang === 'ca') {
                window.location.reload();
                return;
            }
        
            document.cookie = `googtrans=/ca/${lang}; path=/;`;
            document.cookie = `googtrans=/ca/${lang}; path=/; domain=.${host}`;
            window.location.reload();
        }        

        const URL_CSV_CONFIG        = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScSqZ3Oknz4LVr8OiATGxLZUTXc6EqkCRGIg1G2mxYemMvn8Bttn9w5eyV9sDVd5w4mI7kJtR7LjFt/pub?gid=0&single=true&output=csv";
        const URL_CSV_ESTRUCTURA    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScSqZ3Oknz4LVr8OiATGxLZUTXc6EqkCRGIg1G2mxYemMvn8Bttn9w5eyV9sDVd5w4mI7kJtR7LjFt/pub?gid=888628017&single=true&output=csv";
        const URL_CSV_COMPONENTS    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScSqZ3Oknz4LVr8OiATGxLZUTXc6EqkCRGIg1G2mxYemMvn8Bttn9w5eyV9sDVd5w4mI7kJtR7LjFt/pub?gid=606337148&single=true&output=csv";
        const URL_CSV_CONTINGUTS    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScSqZ3Oknz4LVr8OiATGxLZUTXc6EqkCRGIg1G2mxYemMvn8Bttn9w5eyV9sDVd5w4mI7kJtR7LjFt/pub?gid=819396845&single=true&output=csv";
        const URL_CSV_FORM_CONTACTE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScSqZ3Oknz4LVr8OiATGxLZUTXc6EqkCRGIg1G2mxYemMvn8Bttn9w5eyV9sDVd5w4mI7kJtR7LjFt/pub?gid=348010806&single=true&output=csv";
        const URL_CSV_PROJECTES     = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScSqZ3Oknz4LVr8OiATGxLZUTXc6EqkCRGIg1G2mxYemMvn8Bttn9w5eyV9sDVd5w4mI7kJtR7LjFt/pub?gid=405305768&single=true&output=csv";
        const URL_CSV_CARRUSELS     = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScSqZ3Oknz4LVr8OiATGxLZUTXc6EqkCRGIg1G2mxYemMvn8Bttn9w5eyV9sDVd5w4mI7kJtR7LjFt/pub?gid=1400064711&single=true&output=csv";

        let dadesWeb = { config: {}, estructura: [], components: {}, continguts: [], projectes: [], carrusels: {} };

        document.addEventListener('DOMContentLoaded', () => {
            carregarDadesPagina();
        });

        const MAPA_COLORS = {
            'Primari': '#301269',
            'Vivid': '#340094',
            'Accent': '#AC80FF',
            'Suau': '#C8AAFF',
            'Clar': '#E3D4FF',
            'Fons fosc': '#24153F',
            'Blanc': '#FFFFFF',
            'Negre': '#000000'
        };
        
        function obtenirColorHex(nomColor, valorPerDefecte = '#24153F') {
            if (!nomColor || nomColor.trim() === '' || nomColor.trim() === '#N/A') {
                return valorPerDefecte;
            }
            const net = nomColor.trim();
            if (MAPA_COLORS[net]) return MAPA_COLORS[net];
            if (net.startsWith('#')) return net;
            if (/^[0-9A-F]{6}$/i.test(net)) return `#${net}`;
            return valorPerDefecte;
        }
                
        async function carregarDadesPagina() {
            try {
                const URLS = {
                    CONFIG: URL_CSV_CONFIG,
                    ESTRUCTURA: URL_CSV_ESTRUCTURA,
                    COMPONENTS: URL_CSV_COMPONENTS,
                    CONTINGUTS: URL_CSV_CONTINGUTS,
                    FORM_CONTACTE: URL_CSV_FORM_CONTACTE,
                    PROJECTES: URL_CSV_PROJECTES,
                    CARRUSELS: URL_CSV_CARRUSELS
                };
        
                const respostes = await Promise.all([
                    fetch(URLS.CONFIG).then(res => res.text()),
                    fetch(URLS.ESTRUCTURA).then(res => res.text()),
                    fetch(URLS.COMPONENTS).then(res => res.text()),
                    fetch(URLS.CONTINGUTS).then(res => res.text()),
                    fetch(URLS.FORM_CONTACTE).then(res => res.text()),
                    fetch(URLS.PROJECTES).then(res => res.text()),
                    fetch(URLS.CARRUSELS).then(res => res.text())
                ]);
        
                dadesWeb.config = parsejarCSVConfig(respostes[0]);
                dadesWeb.estructura = parsejarCSVEstructura(respostes[1]);
                dadesWeb.components = parsejarCSVComponents(respostes[2]);
                dadesWeb.continguts = parsejarCSVContinguts(respostes[3]);
                dadesWeb['FORM_CONTACTE'] = parsejarCSVContinguts(respostes[4]);
                dadesWeb.projectes = parsejarCSVProjectes(respostes[5]);
                dadesWeb.carrusels = parsejarCSVCarrusels(respostes[6]);
                
                actualitzarLogo();
                construirMenuNavegacio();
                construirPantallesWeb();
                carregarPaginaPerHash();
                carregarScriptTraduccio();

            } catch (error) {
                console.error('Error en la càrrega de dades dels CSVs:', error);
            }
        }

        function actualitzarLogo() {
            const logoId = dadesWeb.config['logo'] || dadesWeb.config['logo_id'];
            const imgElement = document.getElementById('logo-img');
            
            if (logoId && imgElement) {
                imgElement.src = `https://drive.google.com/thumbnail?sz=w600&id=${logoId.trim()}`;
            } else if (imgElement) {
                imgElement.src = 'logo_mm_600.jpg';
            }
        }

        function parseCSV(text) {
            let p = '', c = '', r = [];
            let q = false;
            let row = [''];
            for (let i = 0; i < text.length; i++) {
                c = text[i];
                p = text[i - 1];
                if (c === '"') {
                    if (q && text[i + 1] === '"') { row[row.length - 1] += '"'; i++; }
                    else { q = !q; }
                } else if (c === ',' && !q) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !q) {
                    if (c === '\r' && text[i + 1] === '\n') { i++; }
                    r.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') { r.push(row); }
            return r;
        }

        function parsejarCSVConfig(csvText) {
            const files = parseCSV(csvText);
            const config = {};
            files.slice(1).forEach(fila => {
                if (fila[0] && fila[1]) config[fila[0].trim()] = fila[1].trim();
            });
            return config;
        }

        function parsejarCSVComponents(csvText) {
            const files = parseCSV(csvText);
            const components = {};
            files.slice(1).forEach(fila => {
                const nomComponent = (fila[0] || '').trim().toLowerCase();
                if (nomComponent) {
                    components[nomComponent] = {
                        layoutDefecte: (fila[1] || '').trim(),
                        colorFonsDefecte: (fila[2] || '#FFFFFF').trim(),
                        colorTextDefecte: (fila[3] || '#24153F').trim(),
                    };
                }
            });
            return components;
        }        

        function parsejarCSVEstructura(csvText) {
            const files = parseCSV(csvText);
            return files.slice(1)
                .filter(fila => fila[0] && fila[0].trim() !== '')
                .map(fila => {
                    const titolPagina = (fila[1] || '').trim();
                    const rawHeroTitol = (fila[5] || '').trim();
                    const rawHeroText = (fila[6] || '').trim();
                    const rawHeroDestacat = (fila[7] || '').trim();
        
                    let valSpan = (fila[13] || '').trim();
                    let leftSpanCss = '0px';
                    if (valSpan !== '') {
                        let numSpan = parseInt(valSpan);
                        if (!isNaN(numSpan)) leftSpanCss = `${numSpan}px`;
                    }
        
                    let valMidaImatge = (fila[14] || '').trim();
                    let midaImatgeCss = '400px';
                    if (valMidaImatge !== '') {
                        midaImatgeCss = /^\d+$/.test(valMidaImatge) ? `${valMidaImatge}px` : valMidaImatge;
                    }
        
                    return {
                        id: (fila[0] || '').trim(),
                        titol: titolPagina,
                        ordre: parseInt(fila[2]) || 99,
                        visible: fila[3] ? fila[3].toUpperCase().trim() === 'TRUE' : true,
                        tipus: (fila[4] || 'galeria_filtrada').trim(),
                        heroTitol: rawHeroTitol !== '' ? rawHeroTitol.replace(/\n/g, '<br>') : titolPagina,
                        heroText: rawHeroText ? rawHeroText.replace(/\n/g, '<br>') : '',
                        heroDestacat: rawHeroDestacat ? rawHeroDestacat.replace(/\n/g, '<br>') : '',
                        heroImatge: (fila[8] || '').trim(), 
                        heroAmple: fila[10] && fila[10].trim() !== '' ? `${parseInt(fila[10])}px` : '550px',
                        heroAlign: fila[11] ? fila[11].toLowerCase().trim() : 'left',
                        heroFontColor: (fila[12] && fila[12].trim() !== '') ? fila[12].trim() : '#E3D4FF',
                        heroLeftSpan: leftSpanCss,
                        heroMidaImatge: midaImatgeCss,
                        navegacio: fila[15] ? fila[15].toUpperCase().trim() === 'TRUE' : true,
                        grupPagina: (fila[16] || 'principal').toLowerCase().trim()
                    };
                }).sort((a, b) => a.ordre - b.ordre);
        }

        function parsejarCSVContinguts(csvText) {
            const files = parseCSV(csvText);
            return files.slice(1).map(fila => ({
                id: (fila[0] || '').trim(),
                seccio: (fila[1] || '').trim(),
                titol: (fila[2] || '').trim(),
                descripcio: (fila[3] || '').trim(),
                imatgeId: (fila[4] || '').trim(),
                link: (fila[5] || '').trim(),
                destacat: fila[6] ? fila[6].toUpperCase().trim() === 'TRUE' : false,
                tipusComponent: (fila[7] || '').trim(),
                situacioImatge: (fila[8] || 'Esquerra').trim(),
                midaImatge: (fila[9] || '').trim(),
                textBoto: (fila[10] || '').trim(),
                linkBoto: (fila[11] || '').trim(),
                alineacioBoto: (fila[12] || 'Centre').trim(),
                novaFila: fila[13] ? (fila[13].toUpperCase().trim() === 'TRUE' || fila[13].toUpperCase().trim() === 'SI') : false,
                colorFons: (fila[14] || '').trim(),
                colorText: (fila[15] || '').trim(),
                ample: (fila[16] || '').trim(),
                altImatge: (fila[17] || '').trim(),
                velocitat: (fila[18] || '').trim(),
                bucle: (fila[19] || '').trim(),
                videoAutoStart: fila[20] ? (fila[20].toUpperCase().trim() === 'TRUE' || fila[20].toUpperCase().trim() === 'SI') : false,
                videoControls: fila[21] ? (fila[21].toUpperCase().trim() !== 'NO' && fila[21].toUpperCase().trim() !== 'FALSE') : true
            })).filter(item => item.id !== '');
        }

        function parsejarCSVProjectes(csvText) {
            const files = parseCSV(csvText);
            return files.slice(1).map(fila => {
                const getVal = (idx) => (fila[idx] || '').trim();
                return {
                    idProjecte: getVal(0),
                    nomProjecte: getVal(1),
                    estat: getVal(2) || 'Actiu',
                    ordre: getVal(3),
                    portadaTitol: getVal(4),
                    portadaImatgeId: getVal(5),
                    video1Atributs: getVal(7),
                    video1Link: getVal(8),
                    video1Titol: getVal(9),
                    video1Text: getVal(10),
                    video1Alt: getVal(11),
                    video2Atributs: getVal(12),
                    video2Link: getVal(13),
                    video2Titol: getVal(14),
                    video2Text: getVal(15),
                    video2Alt: getVal(16),
                    imatgeText1Id: getVal(17),
                    imatgeText1Titol: getVal(19),
                    imatgeText1Text: getVal(20),
                    imatge1Alt: getVal(21),
                    imatgeText2Id: getVal(22),
                    imatgeText2Titol: getVal(24),
                    imatgeText2Text: getVal(25),
                    imatge2Alt: getVal(26),
                    blocText1Titol: getVal(27),
                    blocText1Text: getVal(28),
                    blocText2Titol: getVal(29),
                    blocText2Text: getVal(30),
                    carrusel: getVal(31),
                    carruselAlt: getVal(32),
                    galeriaActivaId: getVal(33)
                };
            }).filter(item => item.idProjecte !== '' && item.estat.toLowerCase() !== 'inactiu');
        }
        
        function parsejarCSVCarrusels(csvText) {
            if (!csvText) return {};
            const carruselsPerProjecte = {};
            const linies = csvText.split(/\r?\n/);
            for (let i = 1; i < linies.length; i++) {
                if (!linies[i].trim()) continue;
                const cols = linies[i].split(',');
                const idProjecte = cols[0] ? cols[0].trim() : '';
                const idImatge   = cols[1] ? cols[1].trim() : '';
                const linkImatge = cols[2] ? cols[2].trim() : '';
                const descripcio = cols[3] ? cols[3].trim().replace(/^"|"$/g, '') : '';
                
                if (idProjecte && linkImatge && !linkImatge.includes('#N/A')) {
                    if (!carruselsPerProjecte[idProjecte]) {
                        carruselsPerProjecte[idProjecte] = [];
                    }
                    carruselsPerProjecte[idProjecte].push({
                        ID_Imatge: idImatge,
                        Link_Imatge: linkImatge,
                        Descripcio: descripcio
                    });
                }
            }            
            return carruselsPerProjecte;
        }

        function construirMenuNavegacio() {
            const menuUL = document.getElementById('menu-navegacio');
            if (!menuUL) return;
            menuUL.innerHTML = '';
            
            const paginesNavegacio = dadesWeb.estructura.filter(pagina => pagina.visible && pagina.navegacio);
            
            paginesNavegacio.forEach(pagina => {
                const li = document.createElement('li');
                li.innerHTML = `<a href="#${pagina.id}" onclick="navegarA('${pagina.id}', event); return false;">${pagina.titol}</a>`;
                menuUL.appendChild(li);
            });
        }

        window.addEventListener('load', function() {
            ocultarCarregador();
        });
        
        function ocultarCarregador() {
            const loader = document.getElementById('pantalla-carrega');
            if (loader) {
                loader.classList.add('carregat');
            }
        }

        function construirPantallesWeb() {
            const contenidorPrincipal = document.getElementById('seccions-contenidor');
            if (!contenidorPrincipal) return;
            contenidorPrincipal.innerHTML = '';
            
            const configuracioPeu = dadesWeb.continguts.find(item => {
                const tipus = item.tipusComponent ? item.tipusComponent.toLowerCase().trim() : '';
                return tipus === 'peu_de_pagina';
            }) || {};
        
            dadesWeb.estructura.forEach(pagina => {
                if (!pagina.visible) return;
        
                const seccioHTML = document.createElement('section');
                seccioHTML.id = `pantalla-${pagina.id}`;
                seccioHTML.className = `seccio-web grup-${pagina.grupPagina || 'principal'}`;
                
                const teImatge = pagina.heroImatge && pagina.heroImatge.trim() !== '' && pagina.heroImatge.trim() !== '#N/A';
                const urlHeroImatge = teImatge ? `https://drive.google.com/thumbnail?sz=w1600&id=${pagina.heroImatge.trim()}` : '';
                const alçadaHero = (pagina.heroMidaImatge && pagina.heroImatge.trim() !== '' && pagina.heroMidaImatge.trim() !== '#N/A') ? pagina.heroMidaImatge.trim() : '450px';
                const estilFons = teImatge 
                    ? `background-image: linear-gradient(to right, rgba(36, 21, 63, 0.95) 0%, rgba(36, 21, 63, 0.6) 50%, rgba(36, 21, 63, 0.15) 100%), url('${urlHeroImatge}'); background-size: cover; background-position: center;` 
                    : `background-color: var(--color-fons-fosc, #24153F);`;
        
                seccioHTML.innerHTML = `
                    <div class="hero-pagina" style="${estilFons} min-height: ${alçadaHero}; padding: 3rem 2rem; display: flex; align-items: center; justify-content: flex-start; box-sizing: border-box;">
                        <div class="hero-contenedor-flex" style="max-width: 1200px; width: 100%; margin: 0 auto; display: flex; align-items: center;">
                            <div class="hero-caixa-contingut" style="flex: 1 1 ${pagina.heroAmple || '600px'}; max-width: ${pagina.heroAmple || '650px'}; transform: translateX(${pagina.heroLeftSpan || '0px'}); text-align: ${pagina.heroAlign || 'left'}; color: ${pagina.heroFontColor || '#FFFFFF'};">
                                <h1 style="font-size: 2.5rem; font-weight: 700; color: ${pagina.heroFontColor || '#FFFFFF'}; line-height: 1.2; margin-bottom: 1rem; font-family: 'Montserrat', sans-serif;">
                                    ${pagina.heroTitol}
                                </h1>
                                ${pagina.heroText ? `<div class="hero-cos-text" style="font-size: 1.15rem; font-weight: 400; color: ${pagina.heroFontColor || '#FFFFFF'}; margin-top: 1rem; line-height: 1.5; font-family: 'Montserrat', sans-serif;">${pagina.heroText}</div>` : ''}
                                ${pagina.heroDestacat ? `<div class="destacat-hero" style="font-size: 1.25rem; font-weight: 600; color: #AC80FF; margin-top: 1.2rem; font-family: 'Montserrat', sans-serif;">${pagina.heroDestacat}</div>` : ''}
                            </div>
                        </div>
                    </div>
                `;
        
                const elementsSeccio = dadesWeb.continguts.filter(item => {
                    const tipus = item.tipusComponent ? item.tipusComponent.toLowerCase().trim() : '';
                    return item.seccio === pagina.id && tipus !== 'peu_de_pagina';
                });
                
                const contenidorContinguts = document.createElement('div');
                contenidorContinguts.className = 'contenidor-continguts-seccio';
        
                if (elementsSeccio.length > 0) {
                    let contenidorFilaFlex = null;
                    let grupGaleria = [];
                    let grupCarrusel = [];
        
                    const processarGaleriaPendent = () => {
                        if (grupGaleria.length > 0) {
                            contenidorContinguts.appendChild(crearGaleriaActiva(grupGaleria));
                            grupGaleria = [];
                        }
                    };
        
                    const processarCarruselPendent = () => {
                        if (grupCarrusel.length > 0 && contenidorFilaFlex) {
                            contenidorFilaFlex.appendChild(crearCarruselImatges(grupCarrusel));
                            grupCarrusel = [];
                        }
                    };
                    
                    elementsSeccio.forEach(item => {
                        const tipus = item.tipusComponent ? item.tipusComponent.toLowerCase().trim() : '';
        
                        if (tipus !== 'galeria_activa') processarGaleriaPendent();
                        if (tipus !== 'carrusel_imatges') processarCarruselPendent();
        
                        if (tipus === 'galeria_activa') {
                            contenidorFilaFlex = null;
                            grupGaleria.push(item);
                        } else if (tipus === 'espaiador') {
                            contenidorFilaFlex = null;
                            const tempDiv = document.createElement('div');
                            tempDiv.style.width = '100%';
                            tempDiv.innerHTML = crearEspaiador(item);
                            contenidorContinguts.appendChild(tempDiv.firstElementChild);
                        } else if (tipus === 'separador') {
                            contenidorFilaFlex = null;
                            const tempDiv = document.createElement('div');
                            tempDiv.style.width = '100%';
                            tempDiv.innerHTML = crearSeparador(item);
                            contenidorContinguts.appendChild(tempDiv.firstElementChild);
                        } else if (tipus === 'formulari') {
                            contenidorFilaFlex = null;
                            const nomFullFormulari = item.link ? item.link.trim() : '';
                            const campsAssociats = dadesWeb[nomFullFormulari] || [];
                            const tempDiv = document.createElement('div');
                            tempDiv.style.width = '100%';
                            tempDiv.innerHTML = crearFormulari(item, campsAssociats);
                            contenidorContinguts.appendChild(tempDiv.firstElementChild);
                        } else {
                            if (item.novaFila || !contenidorFilaFlex) {
                                processarCarruselPendent();
                                contenidorFilaFlex = document.createElement('div');
                                contenidorFilaFlex.className = 'contenidor-fila-flex';
                                const pos = (item.situacioImatge || '').toLowerCase().trim();
                                if (pos === 'centre' || pos === 'center') contenidorFilaFlex.classList.add('posicio-centre');
                                else if (pos === 'dreta' || pos === 'right') contenidorFilaFlex.classList.add('posicio-dreta');
                                else contenidorFilaFlex.classList.add('posicio-esquerra');
                                contenidorContinguts.appendChild(contenidorFilaFlex);
                            }
        
                            if (tipus === 'carrusel_imatges') {
                                grupCarrusel.push(item);
                            } else if (tipus === 'bloc_text') {
                                contenidorFilaFlex.appendChild(crearBlocText(item));
                            } else if (tipus === 'targeta_imatge_text') {
                                contenidorFilaFlex.appendChild(crearTargetaImatgeText(item));
                            } else if (tipus === 'bloc_imatge_text') {
                                contenidorFilaFlex.appendChild(crearBlocImatgeText(item));
                            } else if (tipus === 'boto_cta') {
                                contenidorFilaFlex.appendChild(crearBotoCTA(item));
                            } else if (tipus === 'video' || tipus === 'video_1:1' || tipus === 'video_16:9' || tipus === 'video_9:16') {
                                const tempDiv = document.createElement('div');
                                tempDiv.innerHTML = crearComponentVideo(item);
                                contenidorFilaFlex.appendChild(tempDiv.firstElementChild);
                            } else {
                                contenidorFilaFlex.appendChild(crearTargetaElement(item));
                            }                    
                        }
                    });
        
                    processarGaleriaPendent();
                    processarCarruselPendent();
                }
        
                const wrapperPeu = document.createElement('div');
                wrapperPeu.style.width = '100%';
                wrapperPeu.innerHTML = crearPeuPagina(configuracioPeu);
                contenidorContinguts.appendChild(wrapperPeu.firstElementChild);
        
                seccioHTML.appendChild(contenidorContinguts);
                contenidorPrincipal.appendChild(seccioHTML);
            });
        }

        function canviarSeccio(nomNovaSeccio) {
            const hashNetejat = (nomNovaSeccio || '').replace('#', '').trim();
            
            if (hashNetejat.startsWith('projecte/') || hashNetejat.startsWith('projectes/') || hashNetejat.startsWith('pr_') || hashNetejat === 'projectes') {
                carregarPaginaProjectes(hashNetejat);
                return; 
            }
        
            if (hashNetejat.startsWith('legal') || hashNetejat.startsWith('avis-legal') || hashNetejat.startsWith('privacitat') || hashNetejat.startsWith('cookies')) {
                carregarPaginaLegal(hashNetejat);
                return;
            }
        
            // Comprovar si les seccions de la Home existeixen al DOM; si no, reconstruir-les
            let targetId = hashNetejat.startsWith('pantalla-') ? hashNetejat : `pantalla-${hashNetejat}`;
            let seccioDesti = document.getElementById(targetId);
            
            if (!seccioDesti) {
                construirPantallesWeb();
                seccioDesti = document.getElementById(targetId);
            }

            const seccions = document.querySelectorAll('.seccio-web');
            seccions.forEach(sec => sec.style.display = 'none');

            if (seccioDesti) {
                seccioDesti.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                activarSeccioInicial();
            }
        }
        
        function carregarPaginaLegal(idLegal) {
            const idNormalitzat = idLegal.replace(/-/g, '_');
            const titolsLegals = {
                'avis_legal': 'AVÍS LEGAL',
                'privacitat': 'POLÍTICA DE PRIVACITAT',
                'cookies': 'POLÍTICA DE COOKIES'
            };
        
            const nomTitol = titolsLegals[idNormalitzat] || idNormalitzat.replace('_', ' ').toUpperCase();
            const paginaData = { nomPagina: nomTitol };
            const contingutLegal = dadesWeb.continguts.filter(item => item.seccio === idNormalitzat || item.seccio === idLegal);
            const configuracioPeu = dadesWeb.continguts.find(item => (item.tipusComponent || '').toLowerCase().trim() === 'peu_de_pagina') || {};
        
            let htmlText = contingutLegal.map(c => `<p>${c.descripcio || ''}</p>`).join('') || `<p>Contingut legal en procés d'actualització.</p>`;
            const main = document.getElementById('seccions-contenidor');
            
            if (main) {
                main.innerHTML = crearPaginaLegal(paginaData, htmlText) + crearPeuPagina(configuracioPeu);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function carregarPaginaProjectes(idProjecte) {
            const main = document.getElementById('seccions-contenidor');
            if (!main) return;
        
            const llistaProjectes = dadesWeb.projectes || [];
            if (!llistaProjectes || llistaProjectes.length === 0) {
                main.innerHTML = `
                    <div style="text-align:center; padding: 4rem 1.5rem; font-family: 'Montserrat', sans-serif; color: #24153F;">
                        <p style="font-size: 1.1rem; color: #301269;">Carregant el Món Mínim...</p>
                    </div>`;
                return;
            }
        
            const htmlProjecte = crearPaginaProjectes(idProjecte, llistaProjectes);
            const configuracioPeu = dadesWeb.continguts.find(item => (item.tipusComponent || '').toLowerCase().trim() === 'peu_de_pagina') || {};
            
            main.innerHTML = htmlProjecte + crearPeuPagina(configuracioPeu);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        function activarSeccioInicial() {
            if (dadesWeb.estructura && dadesWeb.estructura.length > 0) {
                canviarSeccio(dadesWeb.estructura[0].id);
            }
        }

        function toggleMenuMobil() {
            const menu = document.getElementById('menu-navegacio');
            if (menu) menu.classList.toggle('obert');
        }   

        function navegarA(hashDesti, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            const menu = document.getElementById('menu-navegacio');
            if (menu) menu.classList.remove('obert');
                    
            const hashNetejat = hashDesti.startsWith('#') ? hashDesti : '#' + hashDesti;
            window.location.hash = hashNetejat;
        }
            
        function carregarPaginaPerHash() {
            let hash = window.location.hash.replace('#', '').trim();
            if (!hash) {
                activarSeccioInicial();
            } else {
                canviarSeccio(hash);
            }
        }

            const primerItem = items[0] || {};
        
            let velocitatVal = parseInt(opcions.velocitat || primerItem.velocitat) || 25;
            let esBucle = true;
            if (opcions.bucle !== undefined) esBucle = Boolean(opcions.bucle);
            else if (primerItem.bucle !== undefined && primerItem.bucle !== '') {
                const valBucle = primerItem.bucle.toString().trim().toLowerCase();
                esBucle = !(valBucle === 'false' || valBucle === 'no' || valBucle === '0');
            }
        
            contenidor.style.backgroundColor = obtenirColorHex(opcions.colorFons || primerItem.colorFons, 'transparent');
            const carruselPista = document.createElement('div');
            carruselPista.className = 'galeria-activa-pista';
            carruselPista.style.gap = opcions.espaiat || '1.5rem';
        
            if (esBucle) {
                contenidor.classList.add('mode-bucle');
                carruselPista.style.animationDuration = `${velocitatVal}s`;
            } else {
                contenidor.classList.add('mode-manual');

                const card = document.createElement('div');

                const fonsCard = obtenirColorHex(item.colorFons, '#24153F');

                if (!isNaN(alcadaImg)) alcadaImg += 'px';
        
                card.style.backgroundColor = fonsCard;
                card.style.width = ampleCard;
                card.style.minWidth = ampleCard;
                card.style.flex = `0 0 ${ampleCard}`;

                const enllac = item.linkBoto || item.link || '';
                const teEnllac = enllac !== '' && enllac !== '#' && enllac !== '#N/A';
                
                if (teEnllac) {
                    card.classList.add('es-clicable');

                    ` : ''}

        function crearCarruselImatges(items, opcions = {}) {
            if (!items || items.length === 0) return document.createElement('div');
            const primerItem = items[0] || {};
            let velocitatVal = (parseFloat(opcions.velocitat || primerItem.velocitat) || 5) * 1000;
        
            let esBucle = true;
            const rawBucle = opcions.bucle !== undefined ? opcions.bucle : primerItem.bucle;
            if (rawBucle !== undefined && rawBucle !== '') {
                const valStr = rawBucle.toString().trim().toLowerCase();
                esBucle = !(valStr === 'false' || valStr === 'no' || valStr === '0');
            }
        
            let ampleContenidor = primerItem.ample && primerItem.ample.trim() !== '' && primerItem.ample !== '#N/A' ? primerItem.ample.trim() : '900px';
            if (!isNaN(ampleContenidor)) ampleContenidor += 'px';
            
            let alcadaVisor = primerItem.altImatge && primerItem.altImatge.trim() !== '' && primerItem.altImatge !== '#N/A' ? primerItem.altImatge.trim() : '400px';
            if (!isNaN(alcadaVisor)) alcadaVisor += 'px';
        
            const wrapper = document.createElement('div');
            wrapper.className = 'carrusel-imatges-wrapper';
            wrapper.style.backgroundColor = obtenirColorHex(opcions.colorFons || primerItem.colorFons, '#24153F');
            wrapper.style.maxWidth = ampleContenidor;
        
            let indexActual = 0;
            let temporitzador = null;
        
            wrapper.innerHTML = `
                <div class="carrusel-caixa-principal">
                    <button class="boto-carrusel ant" aria-label="Anterior">&#10094;</button>
                    <div class="carrusel-visor" style="height: ${alcadaVisor};">

                    </div>
                    <button class="boto-carrusel seg" aria-label="Següent">&#10095;</button>
                </div>
                <div class="carrusel-peu-text">
                    <h4 class="carrusel-titol"></h4>
                    <p class="carrusel-descripcio"></p>
                </div>
            `;
        
            const elDiapositives = wrapper.querySelector('.carrusel-diapositives');
            const elPeuText = wrapper.querySelector('.carrusel-peu-text');
            const elTitol = wrapper.querySelector('.carrusel-titol');
            const elDescripcio = wrapper.querySelector('.carrusel-descripcio');
            const btnAnt = wrapper.querySelector('.boto-carrusel.ant');
            const btnSeg = wrapper.querySelector('.boto-carrusel.seg');
        
            items.forEach((item, idx) => {
                const slide = document.createElement('div');
                slide.className = `carrusel-slide ${idx === 0 ? 'activa' : ''}`;
                const urlImatge = item.imatgeId && item.imatgeId !== '#N/A' && item.imatgeId.trim() !== '' ? `https://drive.google.com/thumbnail?sz=w1200&id=${item.imatgeId.trim()}` : 'logo_mm_600.jpg';
                slide.innerHTML = `<img src="${urlImatge}" alt="${item.titol || 'Mínim Món'}">`;
                
                const enllac = (item.linkBoto || item.link || '').trim();
                if (enllac && enllac !== '#' && enllac !== '#N/A') {
                    slide.classList.add('es-clicable');
                    slide.style.cursor = 'pointer';
                    slide.onclick = (e) => navegarA(enllac, e);
                }
                elDiapositives.appendChild(slide);
            });
        
            const mostrarDiapositiva = (index) => {
                const slides = wrapper.querySelectorAll('.carrusel-slide');
                slides.forEach((s, i) => s.classList.toggle('activa', i === index));
        
                const itemActual = items[index] || {};
                const colorText = obtenirColorHex(itemActual.colorText, '#E3D4FF');
                elTitol.style.color = colorText;
                elDescripcio.style.color = colorText;
                elTitol.innerText = itemActual.titol || '';
                elDescripcio.innerHTML = itemActual.descripcio ? itemActual.descripcio.replace(/\n/g, '<br>') : '';
            };
        
            const seguent = () => {
                if (indexActual < items.length - 1) indexActual++;
                else if (esBucle) indexActual = 0;
                else return;
                mostrarDiapositiva(indexActual);
            };
        
            const anterior = () => {
                if (indexActual > 0) indexActual--;
                else if (esBucle) indexActual = items.length - 1;
                mostrarDiapositiva(indexActual);
            };
        
            const iniciarAutoplay = () => {
                if (esBucle && velocitatVal > 0) {
                    clearInterval(temporitzador);
                    temporitzador = setInterval(seguent, velocitatVal);
                }
            };

            btnSeg.onclick = (e) => { e.stopPropagation(); seguent(); iniciarAutoplay(); };
            btnAnt.onclick = (e) => { e.stopPropagation(); anterior(); iniciarAutoplay(); };
            
            mostrarDiapositiva(0);
            iniciarAutoplay();
            return wrapper;
        }

        function crearFormulari(item, campsFormulari = []) {
            const titol = item.titol || 'Formulari de Contacte';
            const descripcio = item.descripcio || '';
            const formId = item.link || 'FORM_CONTACTE';
            let campsHTML = '';
        
            const campsValids = campsFormulari.filter(camp => (camp.id || '').trim() !== '');
        
            campsValids.forEach(camp => {
                const idCamp = camp.id || '';
                const etiqueta = camp.seccio || '';
                const tipus = (camp.titol || 'text').toLowerCase().trim();
                const rawOpcions = camp.descripcio || '';
                const llistaOpcions = rawOpcions ? rawOpcions.split(';').map(o => o.trim()).filter(o => o !== '') : [];
                const esObligatori = (camp.imatgeId || camp.Obligatori || '').toString().toUpperCase().trim() === 'SI';
                const reqAttr = esObligatori ? 'required' : '';
                const astil = esObligatori ? '<span style="color: #AC80FF;"> *</span>' : '';

                campsHTML += `<div class="camp-grup" style="margin-bottom: 1.2rem; text-align: left;">`;
                if (etiqueta) campsHTML += `<label class="camp-etiqueta" for="${idCamp}" style="display: block; color: #E3D4FF; font-weight: 500; margin-bottom: 0.4rem; font-family: 'Montserrat', sans-serif;">${etiqueta}${astil}</label>`;
        
                if (tipus === 'textarea') {
                    campsHTML += `<textarea id="${idCamp}" name="${etiqueta || idCamp}" class="camp-textarea" ${reqAttr} style="width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid #AC80FF; background: #301269; color: #FFF; min-height: 100px; font-family: 'Montserrat', sans-serif;"></textarea>`;
                } else if (tipus === 'select') {
                    campsHTML += `
                        <select id="${idCamp}" name="${etiqueta || idCamp}" class="camp-select" ${reqAttr} style="width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid #AC80FF; background: #301269; color: #FFF; font-family: 'Montserrat', sans-serif;">
                            <option value="" disabled selected>Selecciona una opció...</option>
                            ${llistaOpcions.map(op => `<option value="${op}">${op}</option>`).join('')}
                        </select>`;
                } else {
                    campsHTML += `<input type="${tipus}" id="${idCamp}" name="${etiqueta || idCamp}" class="camp-input" ${reqAttr} style="width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid #AC80FF; background: #301269; color: #FFF; font-family: 'Montserrat', sans-serif;" />`;
                }
                campsHTML += `</div>`;
            });
        
            return `
                <div class="formulari-minim-mon" id="wrapper-${formId}" style="background: #24153F; padding: 2rem; border-radius: 10px; border: 1px solid #340094; max-width: 650px; margin: 0 auto;">
                    ${titol ? `<h3 class="formulari-titol" style="color: #FFF; font-size: 1.5rem; margin-bottom: 0.5rem; font-family: 'Montserrat', sans-serif;">${titol}</h3>` : ''}
                    ${descripcio ? `<p class="formulari-descripcio" style="color: #C8AAFF; margin-bottom: 1.5rem; font-family: 'Montserrat', sans-serif;">${descripcio}</p>` : ''}
                    <form id="${formId}" onsubmit="enviarFormulariMinimMon(event, '${formId}')">
                        ${campsHTML}
                        <div class="boto-enviar-container" style="margin-top: 1.5rem; text-align: center;">
                            <button type="submit" class="boto-enviar" style="background: #340094; color: #FFF; padding: 0.8rem 2rem; border: 1px solid #AC80FF; border-radius: 6px; font-weight: 600; cursor: pointer; font-family: 'Montserrat', sans-serif;">Enviar sol·licitud</button>
                        </div>
                    </form>
                </div>`;
        }

        /* PROJECTES SINGULARS */
        function crearPaginaProjectes(idProjecte, llistaProjectes = []) {
            const idNeta = (idProjecte || '').replace('#', '').replace('projecte/', '').replace('projectes/', '').trim();
            const projecte = llistaProjectes.find(p => p.idProjecte === idNeta) || llistaProjectes[0];
        
            if (!projecte) return `<div style="padding: 4rem; text-align: center;"><h2>Projecte no trobat</h2></div>`;
        
            const ordresRaw = projecte.ordre && projecte.ordre.trim() !== '' ? projecte.ordre : 'Portada;Video_1';
            const ordres = ordresRaw.split(';').map(o => o.trim());
        
            let htmlFinal = `<article class="pantalla-projecte-singular" data-id="${projecte.idProjecte}">`;
        
            ordres.forEach(bloc => {
                const blocNom = bloc.toLowerCase().replace(/_/g, '');
                const numExtret = bloc.match(/\d+/);
                const numeroBloc = numExtret ? parseInt(numExtret[0], 10) : 1;
        
                if (blocNom.startsWith('portada') || blocNom.startsWith('hero')) {
                    htmlFinal += renderitzarBlocPortada(projecte);
                } else if (blocNom.startsWith('video')) {
                    htmlFinal += renderitzarBlocVideo(projecte, numeroBloc);
                } else if (blocNom.startsWith('imatgetext') || blocNom.startsWith('imatge')) {
                    htmlFinal += renderitzarBlocImatgeTextProjecte(projecte, numeroBloc);
                } else if (blocNom.startsWith('bloctext')) {
                    htmlFinal += renderitzarBlocTextProjecte(projecte, numeroBloc);
                } else if (blocNom.startsWith('carrusel')) {
                    htmlFinal += renderitzarCarruselProjecte(projecte, dadesWeb.carrusels);
                } else if (blocNom.startsWith('galeria')) {
                    htmlFinal += renderitzarGaleriaProjecte(projecte);
                }
            });
        
            htmlFinal += `</article>`;
            return htmlFinal;
        }

        function renderitzarBlocPortada(p) {
            let imatgeUrl = p.portadaImatgeId ? `https://drive.google.com/thumbnail?id=${p.portadaImatgeId.trim()}&sz=w1600` : 'logo_mm_600.jpg';
            const titol = p.portadaTitol || p.nomProjecte || 'Mínim Món';
        
            return `
                <div class="portada-wrapper-projecte" style="position: relative; width: 100%; height: 320px; overflow: hidden; background-color: #24153F;">
                    <img src="${imatgeUrl}" alt="${titol}" style="width: 100%; height: 100%; object-fit: cover;" />
                    <div class="overlay-portada" style="position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(180deg, rgba(36,21,63,0.3) 0%, rgba(36,21,63,0.85) 100%);"></div>
                    <div class="contingut-text-portada" style="position: absolute; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center;">
                        <h1 style="color:#FFF; font-family:'Montserrat', sans-serif; font-size: 2.2rem; text-align:center;">${titol}</h1>
                    </div>
                </div>`;
        }

        function renderitzarBlocVideo(projecte, numVideo) {
            const videoLink = projecte[`video${numVideo}Link`] || '';
            if (!videoLink) return '';

            return `
                <section class="seccio-bloc-video-targeta" style="padding: 2rem 1rem; max-width: 1000px; margin: 0 auto;">
                    ${crearComponentVideo({
                        link: videoLink,
                        titol: projecte[`video${numVideo}Titol`] || '',
                        descripcio: projecte[`video${numVideo}Text`] || '',
                        videoControls: true
                    })}
                </section>`;
        }

        function renderitzarBlocImatgeTextProjecte(projecte, numBloc = 1) {
            const imatgeId = projecte[`imatgeText${numBloc}Id`] || projecte[`imatgeText_${numBloc}_ID`] || '';
            if (!imatgeId) return '';

            return `
                <section class="seccio-bloc-imatge-targeta" style="padding: 2rem 1rem; max-width: 1000px; margin: 0 auto;">
                    ${crearBlocImatgeText({
                        imatgeId: imatgeId,
                        titol: projecte[`imatgeText${numBloc}Titol`] || '',
                        descripcio: projecte[`imatgeText${numBloc}Text`] || ''
                    }).outerHTML}
                </section>`;
        }

        function renderitzarBlocTextProjecte(projecte, numeroBloc = 1) {
            const titol = projecte[`blocText${numeroBloc}Titol`] || '';
            const text = projecte[`blocText${numeroBloc}Text`] || '';
            if (!titol && !text) return '';

            return `
                <section class="seccio-bloc-text-targeta" style="padding: 2rem 1rem; max-width: 900px; margin: 0 auto; color: #E3D4FF; font-family: 'Montserrat', sans-serif;">
                    ${titol ? `<h2 style="color: #FFF; font-size: 1.6rem; margin-bottom: 1rem;">${titol}</h2>` : ''}
                    ${text ? `<div style="line-height: 1.6;">${text.replace(/\n/g, '<br>')}</div>` : ''}
                </section>`;
        }

        function renderitzarCarruselProjecte(projecte, mapCarrusels) {
            const idProj = projecte.idProjecte || '';
            const fotosCarrusel = mapCarrusels[idProj] || [];
            if (fotosCarrusel.length === 0) return '';

            const itemsCarrusel = fotosCarrusel.map(f => ({
                imatgeId: f.ID_Imatge,
                descripcio: f.Descripcio
            }));

            const elCarrusel = crearCarruselImatges(itemsCarrusel);
            return `<section class="seccio-carrusel-projecte" style="padding: 2rem 1rem; display: flex; justify-content: center;">${elCarrusel.outerHTML}</section>`;
        }

        function renderitzarGaleriaProjecte(projecteActual) {
            // Filtrar projectes actius excloent el projecte que s'està mostrant actualment
            const altresProjectes = (dadesWeb.projectes || []).filter(p => p.idProjecte !== projecteActual.idProjecte);
            if (altresProjectes.length === 0) return '';

            const itemsGaleria = altresProjectes.map(p => ({
                titol: p.nomProjecte,
                imatgeId: p.portadaImatgeId,
                linkBoto: `#projecte/${p.idProjecte}`
            }));

            const galeriaElement = crearGaleriaActiva(itemsGaleria, { bucle: true, velocitat: 20 });
            
            return `
                <section class="seccio-galeria-relacionada" style="padding: 3rem 1rem; background-color: #24153F; border-top: 1px solid #340094;">
                    <h3 style="text-align: center; color: #FFFFFF; font-family: 'Montserrat', sans-serif; margin-bottom: 1.5rem;">Descobreix altres Móns Mínims</h3>
                    ${galeriaElement.outerHTML}
                </section>`;
        }

        function crearPaginaLegal(paginaData, continguts) {
            return `
            <div class="pantalla-legal" style="background-color: #24153F; color: #E3D4FF; font-family: 'Montserrat', sans-serif; min-height: 80vh; padding: 3rem 1.5rem; box-sizing: border-box;">
                <div style="max-width: 800px; margin: 0 auto;">
                    <header style="border-bottom: 1px solid #AC80FF; padding-bottom: 1.5rem; margin-bottom: 2.5rem;">
                        <h1 style="color: #FFFFFF; font-size: 2.2rem; font-weight: 700; margin: 0 0 0.5rem 0;">${paginaData.nomPagina}</h1>
                        <p style="color: #C8AAFF; font-size: 0.9rem; margin: 0;">Mínim Món &middot; Informació legal i transparència</p>
                    </header>
                    <article class="contingut-legal" style="font-size: 0.95rem; line-height: 1.7; color: #E3D4FF;">${continguts}</article>
                </div>
            </div>`;
        }
    </script>
